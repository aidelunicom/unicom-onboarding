<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UNICOM Telecom — Account Setup</title>
  <style>
    :root {
      --navy:#002B6B; --navy2:#003a8c;
      --amber-bg:#FEF3C7; --amber-bd:#B45309; --amber-tx:#92400E;
      --blue-bg:#DBEAFE; --blue-bd:#1D4ED8; --blue-tx:#1E40AF;
      --g50:#F9FAFB; --g100:#F3F4F6; --g200:#E5E7EB;
      --g300:#D1D5DB; --g500:#6B7280; --g700:#374151; --g900:#111827;
      --green:#059669; --green-bg:#D1FAE5;
      --red:#DC2626; --white:#fff;
      --r:10px; --sh:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
      --shm:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -1px rgba(0,0,0,.06);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,-apple-system,BlinkMacSystemFont,sans-serif;background:#EFF4F9;color:var(--g900);min-height:100vh}

    /* HEADER */
    .hdr{background:var(--navy);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shm)}
    .hdr-l{font-size:17px;font-weight:700;color:#fff;letter-spacing:.3px}
    .hdr-sub{font-size:12px;color:rgba(255,255,255,.7);margin-top:1px}
    .hdr-btn{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);padding:8px 14px;border-radius:7px;text-decoration:none;font-size:13px;font-weight:500;transition:background .15s;white-space:nowrap}
    .hdr-btn:hover{background:rgba(255,255,255,.25)}

    /* LAYOUT */
    .wrap{max-width:720px;margin:0 auto;padding:24px 16px 90px}

    /* PROGRESS */
    .prog-wrap{background:#fff;border-radius:var(--r);padding:18px 24px;margin-bottom:20px;box-shadow:var(--sh)}
    .prog-steps{display:flex;align-items:flex-start}
    .prog-step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative}
    .prog-step:not(:last-child)::after{content:'';position:absolute;top:15px;left:50%;width:100%;height:2px;background:var(--g200);z-index:0;transition:background .3s}
    .prog-step.done:not(:last-child)::after{background:var(--navy)}
    .prog-num{width:30px;height:30px;border-radius:50%;background:var(--g200);color:var(--g500);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;transition:all .3s;flex-shrink:0}
    .prog-step.active .prog-num{background:var(--navy);color:#fff}
    .prog-step.done .prog-num{background:var(--green);color:#fff}
    .prog-label{font-size:10px;color:var(--g500);margin-top:5px;text-align:center;font-weight:500;line-height:1.3}
    .prog-step.active .prog-label{color:var(--navy);font-weight:700}
    .prog-step.done .prog-label{color:var(--green)}

    /* CARD */
    .card{background:#fff;border-radius:var(--r);padding:26px 28px;box-shadow:var(--sh);margin-bottom:16px}
    .card-title{font-size:19px;font-weight:700;color:var(--navy);padding-bottom:12px;border-bottom:2px solid var(--navy);margin-bottom:8px}
    .card-sub{font-size:14px;color:var(--g500);margin-bottom:20px;line-height:1.5}

    /* INSTRUCTION BOX */
    .ibox{background:var(--amber-bg);border-left:4px solid var(--amber-bd);border-radius:6px;padding:12px 16px;margin-bottom:20px;font-size:13.5px;color:var(--amber-tx);line-height:1.6}
    .ibox strong{display:block;margin-bottom:3px;font-weight:700}

    /* SCRIPT BOX */
    .sbox{background:var(--blue-bg);border:1px solid var(--blue-bd);border-radius:7px;padding:14px 16px;margin-bottom:20px}
    .sbox-label{font-size:11.5px;font-weight:700;color:var(--blue-tx);display:block;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
    .sbox textarea{width:100%;border:1px solid var(--blue-bd);border-radius:5px;padding:10px 12px;font-size:13.5px;font-family:Arial,sans-serif;line-height:1.6;color:var(--g900);background:#fff;resize:vertical;min-height:90px}
    .sbox textarea:focus{outline:none;border-color:var(--navy)}

    /* FORM */
    .field{margin-bottom:16px}
    .field label{display:block;font-size:13px;font-weight:600;color:var(--g700);margin-bottom:5px}
    .field input,.field select,.field textarea{width:100%;border:1px solid var(--g300);border-radius:7px;padding:9px 12px;font-size:14px;font-family:Arial,sans-serif;color:var(--g900);background:#fff;transition:border-color .15s}
    .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(0,43,107,.1)}
    .field textarea{resize:vertical;min-height:70px;line-height:1.5}
    .field-hint{font-size:12px;color:var(--g500);margin-top:4px;line-height:1.4}
    .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}

    /* RADIO CARDS */
    .radio-group{display:flex;flex-direction:column;gap:10px}
    .radio-card{border:2px solid var(--g200);border-radius:9px;padding:13px 16px;cursor:pointer;transition:all .15s;display:flex;align-items:flex-start;gap:12px}
    .radio-card:hover{border-color:var(--navy);background:var(--g50)}
    .radio-card.selected{border-color:var(--navy);background:#EFF6FF}
    .radio-card input[type=radio]{margin-top:2px;accent-color:var(--navy);flex-shrink:0}
    .radio-card-title{font-size:14px;font-weight:600;color:var(--g900)}
    .radio-card-desc{font-size:12.5px;color:var(--g500);margin-top:2px}

    /* CONDITIONAL */
    .cond{display:none}.cond.show{display:block}

    /* USERS TABLE */
    .tbl-wrap{overflow-x:auto;margin-bottom:14px;border-radius:8px;border:1px solid var(--g200)}
    .utbl{width:100%;border-collapse:collapse;font-size:13px;min-width:580px}
    .utbl th{background:var(--navy);color:#fff;padding:10px 10px;text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.3px}
    .utbl td{padding:5px 5px;border-bottom:1px solid var(--g200);vertical-align:middle}
    .utbl tr:last-child td{border-bottom:none}
    .utbl tr:nth-child(even) td{background:var(--g50)}
    .utbl input,.utbl select{width:100%;border:1px solid var(--g300);border-radius:5px;padding:6px 8px;font-size:12.5px;font-family:Arial,sans-serif;background:#fff;color:var(--g900)}
    .utbl input:focus,.utbl select:focus{outline:none;border-color:var(--navy)}
    .ext-inp{width:56px!important;text-align:center;font-weight:700;color:var(--navy)}
    .del-btn{background:none;border:none;color:var(--g300);cursor:pointer;font-size:18px;padding:2px 6px;line-height:1;transition:color .15s;font-weight:300}
    .del-btn:hover{color:var(--red)}
    .add-row-btn{display:inline-flex;align-items:center;gap:6px;background:var(--g100);border:1.5px dashed var(--g300);border-radius:7px;padding:8px 16px;font-size:13px;color:var(--g700);cursor:pointer;font-weight:500;font-family:Arial,sans-serif;transition:all .15s;margin-top:4px}
    .add-row-btn:hover{background:var(--g200);border-color:var(--navy);color:var(--navy)}

    /* ROUTING TABLE */
    .rtbl{width:100%;border-collapse:collapse;margin-bottom:16px;border-radius:8px;overflow:hidden;border:1px solid var(--g200)}
    .rtbl th{background:var(--navy);color:#fff;padding:10px 12px;text-align:left;font-size:12px;font-weight:600;letter-spacing:.3px}
    .rtbl td{padding:8px 10px;border-bottom:1px solid var(--g200);vertical-align:middle}
    .rtbl tr:last-child td{border-bottom:none}
    .rtbl tr:nth-child(even) td{background:var(--g50)}
    .opt-lbl{font-weight:600;font-size:13px;color:var(--g700);white-space:nowrap;padding-right:12px;width:160px}
    .rtbl input,.rtbl select{width:100%;border:1px solid var(--g300);border-radius:5px;padding:7px 10px;font-size:13px;font-family:Arial,sans-serif;background:#fff;color:var(--g900)}
    .rtbl input:focus,.rtbl select:focus{outline:none;border-color:var(--navy)}

    /* AFTER HOURS */
    .ah-opts{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
    .ah-opt{display:flex;align-items:center;gap:12px;padding:13px 16px;border:2px solid var(--g200);border-radius:9px;cursor:pointer;transition:all .15s}
    .ah-opt:hover{border-color:var(--navy)}
    .ah-opt.selected{border-color:var(--navy);background:#EFF6FF}
    .ah-opt input[type=radio]{accent-color:var(--navy)}
    .ah-opt-text{font-size:14px;font-weight:500}

    /* VOICE CARDS */
    .voice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .voice-card{border:2px solid var(--g200);border-radius:9px;padding:13px 14px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:11px}
    .voice-card:hover{border-color:var(--navy)}
    .voice-card.selected{border-color:var(--navy);background:#EFF6FF}
    .voice-icon{font-size:24px;flex-shrink:0}
    .voice-name{font-size:14px;font-weight:600;color:var(--g900)}
    .voice-desc{font-size:12px;color:var(--g500);margin-top:1px}

    /* SMS TOGGLE */
    .tog-wrap{display:flex;align-items:center;gap:12px;margin-bottom:20px}
    .tog{position:relative;width:44px;height:24px;flex-shrink:0}
    .tog input{opacity:0;width:0;height:0}
    .tog-sl{position:absolute;inset:0;background:var(--g300);border-radius:24px;cursor:pointer;transition:background .2s}
    .tog-sl::before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;left:3px;top:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
    .tog input:checked+.tog-sl{background:var(--navy)}
    .tog input:checked+.tog-sl::before{transform:translateX(20px)}
    .tog-lbl{font-size:14px;font-weight:500;color:var(--g700)}

    /* SECTION DIVIDER */
    .divider{font-size:13.5px;font-weight:700;color:var(--navy);margin:22px 0 14px;display:flex;align-items:center;gap:10px}
    .divider::after{content:'';flex:1;height:1px;background:var(--g200)}

    /* REVIEW */
    .rv-section{margin-bottom:22px}
    .rv-title{font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--g200)}
    .rv-row{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;font-size:13.5px;border-bottom:1px solid var(--g100);gap:16px}
    .rv-row:last-child{border-bottom:none}
    .rv-key{color:var(--g500);flex-shrink:0;min-width:150px}
    .rv-val{color:var(--g900);font-weight:500;text-align:right}
    .rv-utbl{width:100%;border-collapse:collapse;font-size:12.5px;border-radius:6px;overflow:hidden;border:1px solid var(--g200)}
    .rv-utbl th{background:var(--g100);padding:7px 10px;text-align:left;font-size:11px;color:var(--g500);text-transform:uppercase;letter-spacing:.4px}
    .rv-utbl td{padding:7px 10px;border-bottom:1px solid var(--g100);color:var(--g700)}
    .rv-utbl tr:last-child td{border-bottom:none}
    .rv-script{font-size:12.5px;color:var(--g700);white-space:pre-wrap;background:var(--g50);padding:10px 12px;border-radius:6px;width:100%;margin-top:4px;line-height:1.6}

    /* NAV BAR */
    .nav-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--g200);padding:14px 16px;z-index:100}
    .nav-inner{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
    .btn{display:inline-flex;align-items:center;gap:7px;padding:10px 22px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:Arial,sans-serif}
    .btn-sec{background:var(--g100);color:var(--g700)}.btn-sec:hover{background:var(--g200)}
    .btn-pri{background:var(--navy);color:#fff}.btn-pri:hover{background:var(--navy2)}
    .btn-sub{background:var(--green);color:#fff;font-size:15px;padding:11px 28px}.btn-sub:hover{background:#047857}
    .step-ct{font-size:13px;color:var(--g500)}

    /* SUCCESS */
    .succ{text-align:center;padding:36px 20px}
    .succ-icon{width:72px;height:72px;background:var(--green-bg);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:34px;color:var(--green)}
    .succ-h{font-size:24px;font-weight:700;color:var(--g900);margin-bottom:10px}
    .succ-body{font-size:15px;color:var(--g500);line-height:1.7;max-width:440px;margin:0 auto 24px}
    .succ-list{background:var(--green-bg);border-radius:10px;padding:16px 20px;max-width:380px;margin:0 auto 24px;text-align:left}
    .succ-list h4{font-size:13.5px;font-weight:600;color:var(--green);margin-bottom:8px}
    .succ-list ul{font-size:13px;color:var(--g700);line-height:2.1;padding-left:18px}

    @media(max-width:600px){
      .field-row{grid-template-columns:1fr}
      .voice-grid{grid-template-columns:1fr}
      .prog-label{display:none}
      .card{padding:18px}
      .hdr-btn span{display:none}
    }
  </style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="hdr-l">UNICOM Telecom</div>
    <div class="hdr-sub">Account Setup Wizard</div>
  </div>
  <a class="hdr-btn" href="https://outlook.office.com/bookwithme/user/a5eed456acd44bc79b7486c7d3a21a3b%40unicomtelecom.com?anonymous&isanonymous=true" target="_blank">
    📅 <span>Book a call instead</span>
  </a>
</div>

<div class="wrap">
  <div class="prog-wrap"><div class="prog-steps" id="prog"></div></div>
  <div id="content"></div>
</div>

<div class="nav-bar" id="navBar">
  <div class="nav-inner">
    <button class="btn btn-sec" id="btnBack" onclick="go(-1)">← Back</button>
    <span class="step-ct" id="stepCt"></span>
    <button class="btn btn-pri" id="btnNext" onclick="go(1)">Continue →</button>
  </div>
</div>

<script>
const STEPS = ["Phone Numbers","Users & Extensions","Call Flow","Auto Attendant","SMS Setup","Review & Submit"];

const S = {
  step: 0,
  // Step 1
  phoneType:'', phoneNum:'', carrier:'', authName:'', areaCode:'',
  // Step 2
  users:[
    {fn:'',ln:'',email:'',ext:'201',dev:'App',mac:''},
    {fn:'',ln:'',email:'',ext:'202',dev:'App',mac:''},
    {fn:'',ln:'',email:'',ext:'203',dev:'App',mac:''},
  ],
  // Step 3
  routing:[
    {opt:'Press 1',to:''},
    {opt:'Press 2',to:''},
    {opt:'Press 9',to:'Hours & location greeting'},
    {opt:'No Input / Timeout',to:''},
  ],
  ahOpt:'', ahFwd:'', ahOther:'', bizHours:'', bizAddr:'',
  // Step 4
  mainScript:`Thank you for calling [Company Name].\n\nFor Sales, press 1.\nFor Support, press 2.\nFor our hours and location, press 9.\nTo speak with someone directly, press 0, or stay on the line.`,
  afterScript:`Thank you for calling [Company Name]. Our office is currently closed.\n\nOur business hours are [your hours]. Please leave a message and we'll return your call on the next business day.`,
  hoursScript:`Thank you for calling [Company Name].\n\nWe are open Monday through Friday, 9am to 5pm.\nWe are located at [your address].`,
  voice:'carmen',
  // Step 5
  smsOn:false, smsBiz:'', smsEIN:'', smsUse:'', smsSample:''
};

/* ── SAVE ── */
function save() {
  const s = S.step;
  const g = id => { const e=document.getElementById(id); return e?e.value:''; };

  if (s===0) {
    const sel = document.querySelector('.radio-card.selected input');
    S.phoneType = sel ? sel.value : S.phoneType;
    S.phoneNum = g('phoneNum'); S.carrier = g('carrier');
    S.authName = g('authName'); S.areaCode = g('areaCode');
  }
  if (s===1) {
    S.users = Array.from(document.querySelectorAll('.urow')).map(r=>({
      fn:  r.querySelector('.ufn').value,
      ln:  r.querySelector('.uln').value,
      email: r.querySelector('.uem').value,
      ext: r.querySelector('.uex').value,
      dev: r.querySelector('.udv').value,
      mac: r.querySelector('.umc').value
    }));
  }
  if (s===2) {
    document.querySelectorAll('.rrow').forEach((r,i)=>{
      if(S.routing[i]) S.routing[i].to = r.querySelector('.rinp').value;
    });
    const ah = document.querySelector('.ah-opt.selected input');
    S.ahOpt = ah ? ah.value : S.ahOpt;
    S.ahFwd = g('ahFwd'); S.ahOther = g('ahOther');
    S.bizHours = g('bizHours'); S.bizAddr = g('bizAddr');
  }
  if (s===3) {
    S.mainScript  = g('mainScript')  || S.mainScript;
    S.afterScript = g('afterScript') || S.afterScript;
    S.hoursScript = g('hoursScript') || S.hoursScript;
    const vc = document.querySelector('.voice-card.selected');
    if (vc) S.voice = vc.dataset.v;
  }
  if (s===4) {
    const tog = document.getElementById('smsTog');
    S.smsOn = tog ? tog.checked : S.smsOn;
    S.smsBiz = g('smsBiz'); S.smsEIN = g('smsEIN');
    S.smsUse = g('smsUse'); S.smsSample = g('smsSample');
  }
}

/* ── NAVIGATE ── */
function go(dir) {
  save();
  const next = S.step + dir;
  if (next < 0 || next > STEPS.length) return;
  S.step = next;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ── RENDER ── */
function render() {
  renderProg();
  if (S.step === STEPS.length) { showSuccess(); return; }
  document.getElementById('navBar').style.display = '';
  document.getElementById('stepCt').textContent = `Step ${S.step+1} of ${STEPS.length}`;
  document.getElementById('btnBack').style.visibility = S.step===0 ? 'hidden' : 'visible';
  const nb = document.getElementById('btnNext');
  if (S.step === STEPS.length-1) {
    nb.textContent = 'Submit ✓'; nb.className = 'btn btn-sub';
  } else {
    nb.textContent = 'Continue →'; nb.className = 'btn btn-pri';
  }
  const fns = [step1,step2,step3,step4,step5,step6];
  document.getElementById('content').innerHTML = fns[S.step]();
  bind();
}

function renderProg() {
  document.getElementById('prog').innerHTML = STEPS.map((s,i)=>{
    const cls = i<S.step?'done':i===S.step?'active':'';
    return `<div class="prog-step ${cls}">
      <div class="prog-num">${i<S.step?'✓':i+1}</div>
      <div class="prog-label">${s}</div>
    </div>`;
  }).join('');
}

/* ── STEP 1: PHONE NUMBERS ── */
function step1() {
  const pt = S.phoneType;
  return `<div class="card">
    <div class="card-title">Step 1 — Your Phone Number(s)</div>
    <div class="card-sub">Let us know how you'd like to handle your phone number so we can get everything set up.</div>
    <div class="ibox">We can keep your existing number or get you a brand new one — your choice.</div>
    <div class="radio-group" id="ptGroup">
      ${rc('port-local', pt==='port-local', 'Porting an existing local number', 'A standard 10-digit line from your current carrier')}
      ${rc('port-tf',    pt==='port-tf',    'Porting an existing toll-free number', 'An 800, 888, 877, 866, or 855 number')}
      ${rc('new',        pt==='new',        'Getting a new number', "We'll assign a number in your preferred area code")}
    </div>
    <div id="portF" class="cond ${(pt==='port-local'||pt==='port-tf')?'show':''}" style="margin-top:20px">
      <div class="field"><label>Phone number to transfer</label><input id="phoneNum" type="tel" placeholder="(555) 555-5555" value="${S.phoneNum}"></div>
      <div class="field-row">
        <div class="field"><label>Current carrier / provider</label><input id="carrier" placeholder="e.g. AT&amp;T, Verizon, Spectrum" value="${S.carrier}"></div>
        <div class="field"><label>Name on the account</label><input id="authName" placeholder="As it appears on your bill" value="${S.authName}"></div>
      </div>
    </div>
    <div id="newF" class="cond ${pt==='new'?'show':''}" style="margin-top:20px">
      <div class="field"><label>Preferred area code</label><input id="areaCode" placeholder="e.g. 973" maxlength="3" style="max-width:120px" value="${S.areaCode}">
      <div class="field-hint">We'll do our best to assign a number in this area code.</div></div>
    </div>
  </div>`;
}
function rc(val,sel,title,desc){
  return `<label class="radio-card${sel?' selected':''}">
    <input type="radio" name="pt" value="${val}"${sel?' checked':''}>
    <div><div class="radio-card-title">${title}</div><div class="radio-card-desc">${desc}</div></div>
  </label>`;
}

/* ── STEP 2: USERS & EXTENSIONS ── */
function step2() {
  return `<div class="card">
    <div class="card-title">Step 2 — Users & Extensions</div>
    <div class="card-sub">Add everyone who will have a phone extension on your account.</div>
    <div class="ibox"><strong>📱 Desk Phone or App?</strong>
    If your team member uses a physical desk phone, we'll need the MAC address — a unique code printed on a sticker on the bottom of the phone. App users can skip that field.</div>
    <div class="tbl-wrap">
      <table class="utbl">
        <thead><tr>
          <th>First Name</th><th>Last Name</th><th>Email</th>
          <th style="width:62px">Ext.</th><th style="width:110px">Device</th>
          <th>MAC Address</th><th style="width:32px"></th>
        </tr></thead>
        <tbody id="ubody">${S.users.map(urow).join('')}</tbody>
      </table>
    </div>
    <button class="add-row-btn" onclick="addUser()">+ Add another user</button>
  </div>`;
}
function urow(u) {
  const isDesk = u.dev==='Desk Phone';
  return `<tr class="urow">
    <td><input class="ufn" placeholder="First" value="${u.fn}"></td>
    <td><input class="uln" placeholder="Last" value="${u.ln}"></td>
    <td><input class="uem" type="email" placeholder="email@company.com" value="${u.email}"></td>
    <td><input class="uex ext-inp" maxlength="4" value="${u.ext}"></td>
    <td><select class="udv" onchange="toggleMAC(this)">
      <option${u.dev==='App'?' selected':''}>App</option>
      <option${isDesk?' selected':''}>Desk Phone</option>
    </select></td>
    <td><input class="umc" placeholder="${isDesk?'e.g. AA:BB:CC:DD:EE:FF':'— App user —'}"${isDesk?'':' disabled style="background:#f9fafb;color:#9ca3af"'} value="${u.mac}"></td>
    <td><button class="del-btn" onclick="delUser(this)" title="Remove">×</button></td>
  </tr>`;
}
function addUser() {
  save();
  const exts = S.users.map(u=>parseInt(u.ext)).filter(e=>!isNaN(e));
  const next = exts.length ? String(Math.max(...exts)+1) : '201';
  S.users.push({fn:'',ln:'',email:'',ext:next,dev:'App',mac:''});
  document.getElementById('ubody').insertAdjacentHTML('beforeend', urow(S.users[S.users.length-1]));
}
function delUser(btn) {
  const rows = document.querySelectorAll('.urow');
  if (rows.length <= 1) return;
  btn.closest('tr').remove();
  save();
}
function toggleMAC(sel) {
  const mac = sel.closest('tr').querySelector('.umc');
  if (sel.value==='Desk Phone') {
    mac.disabled=false; mac.placeholder='e.g. AA:BB:CC:DD:EE:FF';
    mac.style.background=''; mac.style.color='';
  } else {
    mac.disabled=true; mac.placeholder='— App user —';
    mac.style.background='#f9fafb'; mac.style.color='#9ca3af'; mac.value='';
  }
}

/* ── STEP 3: CALL FLOW ── */
function step3() {
  const rows = S.routing.map((r,i)=>{
    const locked = r.opt==='Press 9';
    return `<tr class="rrow">
      <td class="opt-lbl">${r.opt}</td>
      <td><input class="rinp" placeholder="e.g. Sales team, John, Voicemail…" value="${r.to}"${locked?' readonly style="background:#f9fafb;color:#6b7280;font-style:italic"':''}></td>
    </tr>`;
  }).join('');
  return `
  <div class="card">
    <div class="card-title">Step 3A — Main Greeting & Call Routing</div>
    <div class="card-sub">When a customer calls your main number, where should each option go?</div>
    <div class="ibox"><strong>How ring groups work</strong>
    <b>Simultaneous:</b> everyone rings at once and the first available person answers.<br>
    <b>Sequential:</b> calls go to Person A first, then Person B if A doesn't answer, and so on.</div>
    <table class="rtbl"><thead><tr><th style="width:160px">When caller selects</th><th>Rings to</th></tr></thead>
    <tbody>${rows}</tbody></table>
  </div>
  <div class="card">
    <div class="card-title">Step 3B — After-Hours Routing</div>
    <div class="card-sub">What should happen when someone calls outside your business hours?</div>
    <div class="ibox">Callers can go to voicemail, be forwarded to a cell phone, or handled another way.</div>
    <div class="ah-opts">
      ${ahOpt('voicemail','📬 Go to voicemail')}
      ${ahOpt('forward','📲 Ring to a cell / forwarding number')}
      ${ahOpt('other','💬 Other')}
    </div>
    <div id="ahFwdF" class="cond ${S.ahOpt==='forward'?'show':''}">
      <div class="field"><label>Forwarding number</label><input id="ahFwd" type="tel" placeholder="(555) 555-5555" value="${S.ahFwd}"></div>
    </div>
    <div id="ahOtherF" class="cond ${S.ahOpt==='other'?'show':''}">
      <div class="field"><label>Please describe</label><input id="ahOther" placeholder="Describe what you'd like to happen…" value="${S.ahOther}"></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Step 3C — Hours & Location</div>
    <div class="card-sub">This info will be used when callers press 9 for your hours and location.</div>
    <div class="field"><label>Business hours</label>
      <input id="bizHours" placeholder="e.g. Mon–Fri 9am–5pm; Sat–Sun Closed" value="${S.bizHours}"></div>
    <div class="field"><label>Business address</label>
      <input id="bizAddr" placeholder="e.g. 123 Main St, Springfield, NJ 07081" value="${S.bizAddr}"></div>
  </div>`;
}
function ahOpt(val,label){
  return `<label class="ah-opt${S.ahOpt===val?' selected':''}">
    <input type="radio" name="ah" value="${val}"${S.ahOpt===val?' checked':''}>
    <span class="ah-opt-text">${label}</span>
  </label>`;
}

/* ── STEP 4: AUTO ATTENDANT ── */
function step4() {
  const voices = [
    {v:'carmen',icon:'👩',name:'Carmen',desc:'Professional · Female'},
    {v:'james',icon:'👨',name:'James',desc:'Professional · Male'},
    {v:'sophia',icon:'👩',name:'Sophia',desc:'Warm · Female'},
    {v:'michael',icon:'👨',name:'Michael',desc:'Warm · Male'},
  ];
  return `<div class="card">
    <div class="card-title">Step 4 — Auto Attendant Scripts</div>
    <div class="card-sub">These are the recorded messages your callers will hear. We've pre-filled them with samples — edit them to match your business.</div>
    <div class="divider">Main Greeting</div>
    <div class="sbox"><span class="sbox-label">✏️ Edit your main greeting script</span>
      <textarea id="mainScript" rows="6">${S.mainScript}</textarea></div>
    <div class="divider">After-Hours Greeting</div>
    <div class="sbox"><span class="sbox-label">✏️ Edit your after-hours script</span>
      <textarea id="afterScript" rows="5">${S.afterScript}</textarea></div>
    <div class="divider">Hours & Location Greeting</div>
    <div class="sbox"><span class="sbox-label">✏️ Edit your hours & location script</span>
      <textarea id="hoursScript" rows="4">${S.hoursScript}</textarea></div>
    <div class="divider">Voice Selection</div>
    <div class="ibox">Choose the voice that will read your greetings to callers.</div>
    <div class="voice-grid">
      ${voices.map(vc=>`<div class="voice-card${S.voice===vc.v?' selected':''}" data-v="${vc.v}" onclick="pickVoice(this)">
        <div class="voice-icon">${vc.icon}</div>
        <div><div class="voice-name">${vc.name}</div><div class="voice-desc">${vc.desc}</div></div>
      </div>`).join('')}
    </div>
  </div>`;
}
function pickVoice(el){
  document.querySelectorAll('.voice-card').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected'); S.voice=el.dataset.v;
}

/* ── STEP 5: SMS ── */
function step5() {
  return `<div class="card">
    <div class="card-title">Step 5 — SMS / Text Messaging</div>
    <div class="card-sub">Would you like to send and receive text messages on your business number?</div>
    <div class="tog-wrap">
      <label class="tog"><input type="checkbox" id="smsTog"${S.smsOn?' checked':''} onchange="togSMS()"><span class="tog-sl"></span></label>
      <span class="tog-lbl">Yes, enable SMS on my account</span>
    </div>
    <div id="smsFields"${S.smsOn?'':' style="display:none"'}>
      <div class="ibox"><strong>📋 Why do we need this?</strong>
      Federal regulations require all businesses sending text messages to register their use case. This is a one-time step that protects your customers from spam and keeps your messages deliverable.</div>
      <div class="field"><label>Business legal name</label>
        <input id="smsBiz" placeholder="As registered with the IRS" value="${S.smsBiz}"></div>
      <div class="field"><label>Employer Identification Number (EIN)</label>
        <input id="smsEIN" placeholder="XX-XXXXXXX" value="${S.smsEIN}">
        <div class="field-hint">Found on your IRS documents or tax returns. Used only for carrier registration — kept private.</div></div>
      <div class="field"><label>What will you use SMS for?</label>
        <select id="smsUse">
          <option value="">Select one…</option>
          ${['appointment:Appointment reminders','support:Customer support','notifications:Order / status notifications','marketing:Promotions & marketing','2fa:Verification / two-factor codes','other:Other'].map(o=>{const[v,l]=o.split(':');return `<option value="${v}"${S.smsUse===v?' selected':''}>${l}</option>`;}).join('')}
        </select></div>
      <div class="field"><label>Sample message you'd send</label>
        <textarea id="smsSample" rows="3" placeholder="e.g. Hi [Name], your appointment is confirmed for Tuesday at 2pm. Reply STOP to opt out.">${S.smsSample}</textarea>
        <div class="field-hint">Required by carriers — write a real example of a message your customers might receive.</div></div>
    </div>
    <div id="smsOff"${S.smsOn?' style="display:none"':''} style="text-align:center;padding:28px 20px;color:var(--g500)">
      <div style="font-size:36px;margin-bottom:10px">💬</div>
      <div style="font-size:14px">SMS is turned off. You can always enable it later.</div>
    </div>
  </div>`;
}
function togSMS(){
  const on=document.getElementById('smsTog').checked;
  document.getElementById('smsFields').style.display=on?'':'none';
  document.getElementById('smsOff').style.display=on?'none':'';
}

/* ── STEP 6: REVIEW ── */
function step6() {
  const ptLabel={'port-local':'Porting a local number','port-tf':'Porting a toll-free number','new':'Getting a new number'}[S.phoneType]||'—';
  const ahLabel={'voicemail':'Go to voicemail','forward':`Forward to ${S.ahFwd||'—'}`,'other':S.ahOther||'—'}[S.ahOpt]||'—';
  const uTable = `<table class="rv-utbl"><thead><tr><th>Name</th><th>Email</th><th>Ext</th><th>Device</th><th>MAC</th></tr></thead><tbody>
    ${S.users.map(u=>`<tr>
      <td>${[u.fn,u.ln].filter(Boolean).join(' ')||'—'}</td>
      <td>${u.email||'—'}</td><td>${u.ext}</td><td>${u.dev}</td>
      <td style="font-size:11px;color:var(--g500)">${u.mac||(u.dev==='App'?'N/A':'—')}</td>
    </tr>`).join('')}</tbody></table>`;
  return `<div class="card">
    <div class="card-title">Step 6 — Review & Submit</div>
    <div class="card-sub">Take a moment to review your information before submitting. Your onboarding team will be in touch within 1 business day.</div>
    <div class="rv-section">
      <div class="rv-title">📞 Phone Numbers</div>
      <div class="rv-row"><span class="rv-key">Number type</span><span class="rv-val">${ptLabel}</span></div>
      ${S.phoneType!=='new'?`
        <div class="rv-row"><span class="rv-key">Number to transfer</span><span class="rv-val">${S.phoneNum||'—'}</span></div>
        <div class="rv-row"><span class="rv-key">Current carrier</span><span class="rv-val">${S.carrier||'—'}</span></div>
        <div class="rv-row"><span class="rv-key">Name on account</span><span class="rv-val">${S.authName||'—'}</span></div>`:`
        <div class="rv-row"><span class="rv-key">Preferred area code</span><span class="rv-val">${S.areaCode||'—'}</span></div>`}
    </div>
    <div class="rv-section">
      <div class="rv-title">👥 Users & Extensions</div>
      ${uTable}
    </div>
    <div class="rv-section">
      <div class="rv-title">📋 Call Flow</div>
      ${S.routing.map(r=>`<div class="rv-row"><span class="rv-key">${r.opt}</span><span class="rv-val">${r.to||'—'}</span></div>`).join('')}
      <div class="rv-row"><span class="rv-key">After hours</span><span class="rv-val">${ahLabel}</span></div>
      <div class="rv-row"><span class="rv-key">Business hours</span><span class="rv-val">${S.bizHours||'—'}</span></div>
      <div class="rv-row"><span class="rv-key">Address</span><span class="rv-val">${S.bizAddr||'—'}</span></div>
    </div>
    <div class="rv-section">
      <div class="rv-title">🎙️ Auto Attendant</div>
      <div class="rv-row"><span class="rv-key">Voice</span><span class="rv-val" style="text-transform:capitalize">${S.voice}</span></div>
      <div class="rv-row" style="flex-direction:column;align-items:flex-start;gap:5px">
        <span class="rv-key">Main greeting script</span>
        <div class="rv-script">${S.mainScript}</div>
      </div>
    </div>
    <div class="rv-section">
      <div class="rv-title">💬 SMS</div>
      <div class="rv-row"><span class="rv-key">SMS enabled</span><span class="rv-val">${S.smsOn?'Yes':'No'}</span></div>
      ${S.smsOn?`
        <div class="rv-row"><span class="rv-key">Business name</span><span class="rv-val">${S.smsBiz||'—'}</span></div>
        <div class="rv-row"><span class="rv-key">EIN</span><span class="rv-val">${S.smsEIN||'—'}</span></div>
        <div class="rv-row"><span class="rv-key">Use case</span><span class="rv-val">${S.smsUse||'—'}</span></div>`:''}
    </div>
    <div style="background:var(--amber-bg);border:1px solid #FDE68A;border-radius:8px;padding:14px 16px;font-size:13px;color:var(--amber-tx);margin-top:4px">
      ✅ By clicking Submit, you confirm this information is accurate. Your Unicom onboarding specialist will review everything and reach out within 1 business day.
    </div>
  </div>`;
}

/* ── SUCCESS ── */
function showSuccess() {
  submitData();
  document.getElementById('navBar').style.display='none';
  document.getElementById('content').innerHTML=`<div class="card">
    <div class="succ">
      <div class="succ-icon">✓</div>
      <div class="succ-h">You're all set!</div>
      <div class="succ-body">Thank you for completing your account setup.<br>Your Unicom onboarding specialist will review everything and be in touch within <strong>1 business day</strong>.</div>
      <div class="succ-list">
        <h4>What happens next</h4>
        <ul>
          <li>We review your setup information</li>
          <li>We configure your phone system</li>
          <li>We schedule your go-live call</li>
          <li>You're up and running! 🎉</li>
        </ul>
      </div>
      <p style="font-size:13px;color:var(--g500)">Questions? Contact your onboarding team:<br>
      <a href="mailto:onboarding@unicomtelecom.com" style="color:var(--navy)">onboarding@unicomtelecom.com</a></p>
    </div>
  </div>`;
}

/* ── SUBMIT ── */
async function submitData() {
  const WEBHOOK = 'YOUR_ZAPIER_WEBHOOK_URL';
  if (WEBHOOK === 'YOUR_ZAPIER_WEBHOOK_URL') return;
  try {
    await fetch(WEBHOOK, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({...S, submittedAt: new Date().toISOString()})
    });
  } catch(e) { console.error('Webhook error:', e); }
}

/* ── BIND EVENTS ── */
function bind() {
  // Phone type radio cards
  document.querySelectorAll('#ptGroup .radio-card').forEach(c=>{
    c.addEventListener('click', function(){
      document.querySelectorAll('#ptGroup .radio-card').forEach(x=>x.classList.remove('selected'));
      this.classList.add('selected');
      const v = this.querySelector('input').value;
      const pf=document.getElementById('portF'), nf=document.getElementById('newF');
      if(pf) pf.className='cond '+(v==='port-local'||v==='port-tf'?'show':'');
      if(nf) nf.className='cond '+(v==='new'?'show':'');
    });
  });
  // After hours
  document.querySelectorAll('.ah-opt').forEach(o=>{
    o.addEventListener('click', function(){
      document.querySelectorAll('.ah-opt').forEach(x=>x.classList.remove('selected'));
      this.classList.add('selected');
      const v=this.querySelector('input').value;
      const ff=document.getElementById('ahFwdF'), of=document.getElementById('ahOtherF');
      if(ff) ff.className='cond '+(v==='forward'?'show':'');
      if(of) of.className='cond '+(v==='other'?'show':'');
    });
  });
}

render();
</script>
</body>
</html>
