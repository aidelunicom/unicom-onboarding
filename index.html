<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNICOM Telecom — Account Setup</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root{
  --bg:#060e1d;--bg2:#0a1628;
  --card:rgba(8,18,42,0.85);--card-bd:rgba(100,150,255,0.12);
  --pri:#4f8aff;--pri-dark:#2d6cdb;--pri-glow:rgba(79,138,255,0.3);
  --gold:#e0d61e;--gold-glow:rgba(224,214,30,0.3);
  --green:#00e5a0;--green-dark:#00b87d;--green-glow:rgba(0,229,160,0.25);
  --red:#ff4060;--red-bg:rgba(255,64,96,0.08);
  --amber:#ffb800;--amber-bg:rgba(255,184,0,0.07);
  --tx:#e8eeff;--tx2:rgba(232,238,255,0.55);--tx3:rgba(232,238,255,0.28);
  --bd:rgba(100,150,255,0.1);--bd-h:rgba(100,150,255,0.25);
  --inp:rgba(255,255,255,0.04);--inp-bd:rgba(100,150,255,0.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(79,138,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(79,138,255,0.025) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;z-index:0}
body::after{content:'';position:fixed;top:-40%;left:-15%;width:55%;height:55%;background:radial-gradient(ellipse,rgba(0,43,107,0.35) 0%,transparent 70%);pointer-events:none;z-index:0}

/* HEADER */
.hdr{background:rgba(2,8,25,0.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid rgba(79,138,255,0.12);padding:12px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.hdr-sub{font-size:11px;color:rgba(161,182,247,0.55);margin-top:2px;letter-spacing:.05em}
.hdr-actions{display:flex;gap:8px;align-items:center}
.hdr-btn{display:flex;align-items:center;gap:6px;background:rgba(79,138,255,0.07);color:rgba(161,182,247,0.85);border:1px solid rgba(79,138,255,0.18);padding:7px 14px;border-radius:7px;text-decoration:none;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .2s;letter-spacing:.02em}
.hdr-btn:hover{background:rgba(79,138,255,0.14);border-color:rgba(79,138,255,0.38);color:#fff}
.save-toast{position:fixed;top:72px;right:20px;background:rgba(0,229,160,0.12);border:1px solid rgba(0,229,160,0.35);color:var(--green);padding:10px 16px;border-radius:8px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;backdrop-filter:blur(10px)}
.save-toast.show{opacity:1}

/* LAYOUT */
.wrap{max-width:760px;margin:0 auto;padding:28px 20px 100px;position:relative;z-index:1}

/* PROGRESS */
.prog-wrap{background:rgba(8,18,42,0.72);backdrop-filter:blur(24px);border:1px solid var(--card-bd);border-radius:14px;padding:18px 24px;margin-bottom:20px}
.prog-steps{display:flex;align-items:flex-start}
.prog-step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative}
.prog-step:not(:last-child)::after{content:'';position:absolute;top:14px;left:50%;width:100%;height:1px;background:var(--bd);z-index:0;transition:background .4s}
.prog-step.done:not(:last-child)::after{background:linear-gradient(90deg,var(--pri),rgba(79,138,255,.4))}
.prog-num{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.04);color:var(--tx3);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;border:1px solid var(--bd);transition:all .3s}
.prog-step.active .prog-num{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 0 18px var(--pri-glow)}
.prog-step.done .prog-num{background:rgba(0,229,160,.12);color:var(--green);border-color:rgba(0,229,160,.35);box-shadow:0 0 10px var(--green-glow)}
.prog-label{font-size:9px;color:var(--tx3);margin-top:6px;text-align:center;font-weight:600;line-height:1.3;letter-spacing:.05em;text-transform:uppercase}
.prog-step.active .prog-label{color:var(--pri)}.prog-step.done .prog-label{color:var(--green)}

/* CARD */
.card{background:var(--card);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--card-bd);border-radius:16px;padding:26px 28px;margin-bottom:16px;box-shadow:0 4px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)}
.card-title{font-size:17px;font-weight:700;color:var(--tx);padding-bottom:14px;margin-bottom:10px;border-bottom:1px solid var(--bd);letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.card-title::before{content:'';display:inline-block;width:3px;height:18px;background:linear-gradient(180deg,var(--pri),var(--gold));border-radius:2px;flex-shrink:0}
.card-sub{font-size:13.5px;color:var(--tx2);margin-bottom:20px;line-height:1.6}

/* INFO BOXES */
.ibox{border-left:3px solid;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:13.5px;line-height:1.6}
.ibox.amber{background:var(--amber-bg);border-color:var(--amber);color:rgba(255,184,0,.9)}
.ibox.blue{background:rgba(79,138,255,.06);border-color:var(--pri);color:rgba(161,182,247,.9)}
.ibox.red{background:var(--red-bg);border-color:var(--red);color:rgba(255,100,120,.9)}
.ibox.green{background:rgba(0,229,160,.07);border-color:var(--green);color:rgba(0,229,160,.95)}
.ibox.red a,.ibox.green a{color:inherit}
.nr-row.nr-incomplete{border-color:var(--red)!important;background:rgba(255,64,96,.04)!important}
@keyframes nrFlash{0%,100%{box-shadow:0 0 0 rgba(255,64,96,0)}30%,70%{box-shadow:0 0 0 4px rgba(255,64,96,.35)}}
.nr-flash{animation:nrFlash 1s ease-in-out 2}
.ibox strong{display:block;margin-bottom:4px;font-weight:700}

/* SCRIPT BOX */
.sbox{background:rgba(79,138,255,.05);border:1px solid rgba(79,138,255,.2);border-radius:10px;padding:14px 16px;margin-bottom:18px}
.sbox-label{font-size:10px;font-weight:700;color:var(--pri);display:block;margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em}
.sbox textarea{width:100%;border:1px solid rgba(79,138,255,.2);border-radius:7px;padding:10px 12px;font-size:13.5px;font-family:inherit;line-height:1.6;color:var(--tx);background:rgba(0,0,0,.3);resize:vertical;min-height:90px;transition:border-color .2s}
.sbox textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-glow)}
.sbox textarea::placeholder{color:var(--tx3)}

/* FORM */
.field{margin-bottom:16px}
.field label,.field-label{display:block;font-size:10.5px;font-weight:700;color:var(--tx2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.07em}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--inp-bd);border-radius:8px;padding:10px 14px;font-size:14px;font-family:inherit;color:var(--tx);background:var(--inp);transition:all .2s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-glow);background:rgba(79,138,255,.05)}
.field input::placeholder,.field textarea::placeholder{color:var(--tx3)}
.field select option{background:#0a1628;color:var(--tx)}
.field textarea{resize:vertical;min-height:70px;line-height:1.5}
.field-hint{font-size:11.5px;color:var(--tx3);margin-top:5px;line-height:1.4}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* NUMBER CARDS */
.num-card{border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:12px;background:rgba(255,255,255,.02);transition:border-color .2s}
.num-card:hover{border-color:var(--bd-h)}
.num-card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.num-card-label{font-size:11px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.06em}
.num-card-ctrls{display:flex;align-items:center;gap:8px}
.num-type-sel{border:1px solid var(--inp-bd);border-radius:6px;padding:5px 10px;font-size:12px;font-family:inherit;color:var(--tx);background:var(--inp)}
.num-type-sel option{background:#0a1628}

/* USERS TABLE */
.card-wide{max-width:1220px;width:94vw;position:relative;left:50%;transform:translateX(-50%)}
.tbl-wrap{overflow-x:auto;margin-bottom:12px;border-radius:10px;border:1px solid var(--bd)}
.utbl{width:100%;border-collapse:collapse;font-size:13px;min-width:1040px}
.utbl th{background:rgba(79,138,255,.08);color:var(--pri);padding:11px 9px;text-align:left;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--bd)}
.utbl td{padding:8px 6px;border-bottom:1px solid rgba(100,150,255,.05);vertical-align:middle}
.utbl tr:last-child td{border-bottom:none}
.utbl tr:hover td{background:rgba(79,138,255,.03)}
.utbl input,.utbl select{width:100%;border:1px solid rgba(100,150,255,.14);border-radius:6px;padding:7px 9px;font-size:13px;font-family:inherit;background:var(--inp);color:var(--tx)}
.utbl input:focus,.utbl select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-glow)}
.utbl input::placeholder{color:var(--tx3)}
.utbl select option{background:#0a1628}
.utbl-toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px}
.utbl-toolbar a,.utbl-toolbar label{color:var(--pri);cursor:pointer;font-weight:600;text-decoration:none}
.utbl-toolbar a:hover,.utbl-toolbar label:hover{text-decoration:underline}
.utbl-toolbar .sep{color:var(--tx3)}
.ext-inp{width:52px!important;text-align:center;font-weight:700;color:var(--gold)!important;font-family:monospace!important}
.pin-inp{width:58px!important;text-align:center;font-weight:600;color:var(--pri)!important;font-family:monospace!important}
.del-btn{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:18px;padding:2px 5px;line-height:1;transition:color .15s}
.del-btn:hover{color:var(--red)}
.add-row-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(79,138,255,.06);border:1px dashed rgba(79,138,255,.22);border-radius:8px;padding:8px 18px;font-size:13px;color:var(--pri);cursor:pointer;font-weight:600;font-family:inherit;transition:all .15s;margin-top:6px}
.add-row-btn:hover{background:rgba(79,138,255,.12);border-color:var(--pri)}

/* ROUTING TABLE */
.rtbl{width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid var(--bd);margin-bottom:16px}
.rtbl th{background:rgba(79,138,255,.08);color:var(--pri);padding:10px 14px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.rtbl td{padding:8px 8px;border-bottom:1px solid rgba(100,150,255,.05);vertical-align:middle}
.rtbl tr:last-child td{border-bottom:none}
.opt-lbl{font-weight:700;font-size:12.5px;color:var(--tx2);white-space:nowrap;padding-right:12px;width:175px}
.rtbl input{width:100%;border:1px solid var(--inp-bd);border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit;background:var(--inp);color:var(--tx)}
.rtbl input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-glow)}
.rtbl input::placeholder{color:var(--tx3)}

/* AFTER HOURS */
.ah-opts{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.ah-opt{display:flex;align-items:center;gap:12px;padding:13px 16px;border:1px solid var(--bd);border-radius:10px;cursor:pointer;transition:all .15s;background:rgba(255,255,255,.02)}
.ah-opt:hover{border-color:var(--pri);background:rgba(79,138,255,.05)}
.ah-opt.selected{border-color:var(--pri);background:rgba(79,138,255,.09);box-shadow:0 0 14px var(--pri-glow)}
.ah-opt input[type=radio]{accent-color:var(--pri)}.ah-opt-text{font-size:14px;font-weight:500;color:var(--tx)}
.cond{display:none}.cond.show{display:block}

/* VOICE GRID */
.voice-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.voice-card{border:1px solid var(--bd);border-radius:10px;padding:12px;cursor:pointer;transition:all .2s;text-align:center;background:rgba(255,255,255,.02)}
.voice-card:hover{border-color:var(--pri);background:rgba(79,138,255,.06)}
.voice-card.selected{border-color:var(--pri);background:rgba(79,138,255,.1);box-shadow:0 0 16px var(--pri-glow)}
.voice-icon{font-size:22px;margin-bottom:5px}
.voice-name{font-size:13px;font-weight:700;color:var(--tx)}
.voice-gender{font-size:10px;color:var(--tx3);margin-bottom:7px;text-transform:uppercase;letter-spacing:.05em}
.play-btn{display:inline-flex;align-items:center;gap:4px;background:rgba(79,138,255,.12);color:var(--pri);border:1px solid rgba(79,138,255,.28);border-radius:5px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s}
.play-btn:hover{background:rgba(79,138,255,.22)}.play-btn.playing{background:rgba(0,229,160,.12);color:var(--green);border-color:rgba(0,229,160,.35)}

/* SMS TOGGLE */
.tog-wrap{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.tog{position:relative;width:44px;height:24px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0}
.tog-sl{position:absolute;inset:0;background:rgba(255,255,255,.08);border:1px solid var(--bd);border-radius:24px;cursor:pointer;transition:all .2s}
.tog-sl::before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--tx3);left:2px;top:2px;transition:all .2s}
.tog input:checked+.tog-sl{background:rgba(79,138,255,.18);border-color:var(--pri)}
.tog input:checked+.tog-sl::before{background:var(--pri);transform:translateX(20px);box-shadow:0 0 8px var(--pri-glow)}
.tog-lbl{font-size:14px;font-weight:500;color:var(--tx)}

/* USE CASES */
.use-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.use-card{border:1px solid var(--bd);border-radius:10px;padding:13px 14px;cursor:pointer;transition:all .15s;display:flex;align-items:flex-start;gap:10px;background:rgba(255,255,255,.02)}
.use-card:hover{border-color:var(--pri)}.use-card.selected{border-color:var(--pri);background:rgba(79,138,255,.08);box-shadow:0 0 10px var(--pri-glow)}
.use-card input[type=checkbox]{margin-top:2px;accent-color:var(--pri);flex-shrink:0;width:15px;height:15px}
.use-card-title{font-size:13.5px;font-weight:600;color:var(--tx)}.use-card-desc{font-size:12px;color:var(--tx3);margin-top:2px}
.sample-area{width:100%;border:1px solid var(--inp-bd);border-radius:8px;padding:8px 12px;font-size:13px;font-family:inherit;resize:vertical;margin-bottom:14px;line-height:1.5;background:var(--inp);color:var(--tx)}
.sample-area:focus{outline:none;border-color:var(--pri)}.sample-area::placeholder{color:var(--tx3)}

/* DIVIDER */
.divider{font-size:10px;font-weight:700;color:var(--pri);margin:22px 0 14px;display:flex;align-items:center;gap:10px;text-transform:uppercase;letter-spacing:.1em}
.divider::after{content:"";flex:1;height:1px;background:var(--bd)}

/* UPLOAD */
.upload-zone{border:1.5px dashed rgba(79,138,255,.22);border-radius:10px;padding:20px;text-align:center;cursor:pointer;transition:all .15s;position:relative;margin-bottom:8px;background:rgba(79,138,255,.02)}
.upload-zone:hover{border-color:var(--pri);background:rgba(79,138,255,.06)}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-zone-icon{font-size:28px;margin-bottom:6px}.upload-zone-text{font-size:13.5px;font-weight:600;color:var(--tx2)}
.upload-zone-hint{font-size:12px;color:var(--tx3);margin-top:3px}
.upload-files{list-style:none;margin-top:8px;display:flex;flex-direction:column;gap:6px}
.upload-file{display:flex;align-items:center;gap:8px;background:rgba(0,229,160,.07);border:1px solid rgba(0,229,160,.18);border-radius:6px;padding:6px 10px;font-size:12.5px;color:var(--green)}

/* SIGNATURE PAD */
.sig-pad-wrap{border:1px solid rgba(79,138,255,0.35);border-radius:10px;background:rgba(4,10,28,0.9);margin-bottom:8px;overflow:hidden}
.sig-canvas{width:100%;height:120px;cursor:crosshair;display:block;touch-action:none}
.sig-bar{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:rgba(255,255,255,.02);border-top:1px solid var(--bd);font-size:11.5px;color:var(--tx3)}
.sig-clear{background:none;border:1px solid var(--bd);border-radius:5px;padding:3px 10px;font-size:11.5px;cursor:pointer;color:var(--tx3);font-family:inherit;transition:all .15s}
.sig-clear:hover{border-color:var(--red);color:var(--red)}

/* FAQ */
.faq{border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;overflow:hidden}
.faq-q{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--tx);background:rgba(255,255,255,.02);transition:background .15s}
.faq-q:hover{background:rgba(79,138,255,.05)}
.faq-icon{font-size:20px;color:var(--tx3);font-weight:300;transition:transform .2s}
.faq-q.open .faq-icon{transform:rotate(45deg);color:var(--pri)}
.faq-a{display:none;padding:12px 16px;font-size:13.5px;color:var(--tx2);line-height:1.6;border-top:1px solid var(--bd);background:rgba(0,0,0,.2)}
.faq-a.show{display:block}

/* LOCATION CARDS */
.loc-card{border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:10px;background:rgba(255,255,255,.02)}
.loc-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.loc-lbl{font-size:11px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.06em}
.ext-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ext-chip{display:inline-flex;align-items:center;gap:4px;background:rgba(79,138,255,.07);color:var(--tx2);border:1px solid rgba(79,138,255,.18);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;user-select:none}
.ext-chip.on{background:rgba(79,138,255,.18);color:var(--pri);border-color:var(--pri);box-shadow:0 0 8px var(--pri-glow)}

/* REVIEW */
.rv-section{margin-bottom:22px}
.rv-title{font-size:10px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--bd)}
.rv-row{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;font-size:13.5px;border-bottom:1px solid rgba(100,150,255,.05);gap:16px}
.rv-row:last-child{border-bottom:none}
.rv-key{color:var(--tx3);flex-shrink:0;min-width:160px}.rv-val{color:var(--tx);font-weight:500;text-align:right}
.rv-tbl{width:100%;border-collapse:collapse;font-size:12px;border-radius:8px;overflow:hidden;border:1px solid var(--bd)}
.rv-tbl th{background:rgba(79,138,255,.08);padding:7px 10px;text-align:left;font-size:10px;color:var(--pri);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.rv-tbl td{padding:7px 10px;border-bottom:1px solid rgba(100,150,255,.05);color:var(--tx2)}
.rv-tbl tr:last-child td{border-bottom:none}
.rv-script{font-size:12px;color:var(--tx2);white-space:pre-wrap;background:rgba(0,0,0,.3);padding:10px 12px;border-radius:7px;width:100%;margin-top:4px;line-height:1.6;font-family:monospace;border:1px solid var(--bd)}

/* EXPORT BOX */
.export-box{background:linear-gradient(135deg,rgba(0,43,107,.92),rgba(8,18,50,.92));border:1px solid rgba(79,138,255,.28);border-radius:14px;padding:22px 26px;color:#fff;margin-bottom:16px;box-shadow:0 0 32px rgba(79,138,255,.1)}
.export-box h3{font-size:16px;font-weight:700;margin-bottom:6px;color:#fff}
.export-box p{font-size:13px;color:rgba(161,182,247,.65);margin-bottom:14px;line-height:1.5}
.export-box input{width:100%;border:1px solid rgba(79,138,255,.28);border-radius:8px;padding:10px 14px;font-size:14px;font-family:inherit;color:#fff;background:rgba(255,255,255,.07);margin-bottom:14px}
.export-box input::placeholder{color:rgba(161,182,247,.35)}
.export-box input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-glow)}
.export-btns{display:flex;flex-wrap:wrap;gap:10px}
.btn-exp{display:inline-flex;align-items:center;gap:7px;background:var(--gold);color:#000;border:none;border-radius:8px;padding:10px 20px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;box-shadow:0 0 18px var(--gold-glow)}
.btn-exp:hover{background:#f0e820;box-shadow:0 0 26px var(--gold-glow)}
.btn-pdf{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.07);color:rgba(161,182,247,.85);border:1px solid rgba(79,138,255,.28);border-radius:8px;padding:10px 20px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-pdf:hover{background:rgba(79,138,255,.15);border-color:var(--pri);color:#fff}

/* NAV BAR */
.nav-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(6,14,29,.96);backdrop-filter:blur(24px);border-top:1px solid var(--bd);padding:14px 20px;z-index:100}
.nav-inner{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-family:inherit;letter-spacing:.02em}
.btn-sec{background:rgba(255,255,255,.05);color:var(--tx2);border:1px solid var(--bd)}
.btn-sec:hover{background:rgba(255,255,255,.08);color:var(--tx)}
.btn-pri{background:linear-gradient(135deg,var(--pri),var(--pri-dark));color:#fff;box-shadow:0 4px 18px var(--pri-glow)}
.btn-pri:hover{box-shadow:0 4px 26px rgba(79,138,255,.5);transform:translateY(-1px)}
.btn-sub{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;font-size:15px;padding:11px 30px;box-shadow:0 4px 18px var(--green-glow)}
.btn-sub:hover{box-shadow:0 4px 26px rgba(0,229,160,.4);transform:translateY(-1px)}
.step-ct{font-size:12px;color:var(--tx3);letter-spacing:.04em}

/* SUCCESS */
.succ{text-align:center;padding:40px 20px}
.succ-icon{width:80px;height:80px;background:rgba(0,229,160,.09);border:1px solid rgba(0,229,160,.28);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:36px;box-shadow:0 0 32px var(--green-glow)}
.succ-h{font-size:26px;font-weight:700;color:var(--tx);margin-bottom:10px}
.succ-body{font-size:15px;color:var(--tx2);line-height:1.7;max-width:440px;margin:0 auto 24px}
.succ-list{background:rgba(0,229,160,.06);border:1px solid rgba(0,229,160,.18);border-radius:12px;padding:18px 22px;max-width:380px;margin:0 auto 24px;text-align:left}
.succ-list h4{font-size:11px;font-weight:700;color:var(--green);margin-bottom:10px;text-transform:uppercase;letter-spacing:.08em}
.succ-list ul{font-size:13.5px;color:var(--tx2);line-height:2.1;padding-left:18px}

@media(max-width:640px){
  .field-row,.field-row3{grid-template-columns:1fr}
  .voice-grid{grid-template-columns:repeat(2,1fr)}
  .use-grid{grid-template-columns:1fr}
  .prog-label{display:none}.card{padding:18px}
}

/* CALL FLOW */
.cf-row{border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px;background:rgba(79,138,255,0.03);transition:border-color .2s}
.cf-row:hover{border-color:var(--bd-h)}
.cf-row-hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:0;flex-wrap:wrap}
.cf-row-hdr select,.cf-row-hdr input{border:1px solid var(--inp-bd);border-radius:7px;padding:8px 12px;font-size:13px;font-family:inherit;color:var(--tx);background:var(--inp);min-width:0}
.cf-row-hdr select:focus,.cf-row-hdr input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-glow)}
.cf-row-hdr select option{background:#0a1628}
.cf-key{width:150px;flex-shrink:0}
.cf-dest{width:180px;flex-shrink:0}
.cf-detail{margin-top:14px;padding-top:14px;border-top:1px solid var(--bd)}
.cf-ring-btn{background:rgba(255,255,255,0.05);border:1px solid var(--bd);border-radius:7px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--tx2);cursor:pointer;font-family:inherit;transition:all .2s}
.cf-ring-btn:hover{border-color:var(--pri);color:var(--pri)}
.cf-ring-btn.active{background:rgba(79,138,255,0.15);border-color:var(--pri);color:var(--pri);box-shadow:0 0 10px var(--pri-glow)}

/* MOBILE RESPONSIVE TABLE */
@media(max-width:700px){
  .utbl thead{display:none}
  .utbl,.utbl tbody,.utbl tr,.utbl td{display:block;width:100%}
  .utbl tr{border:1px solid var(--bd);border-radius:10px;margin-bottom:12px;padding:4px 0;background:rgba(8,18,42,0.6)}
  .utbl td{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid rgba(100,150,255,0.06);gap:8px}
  .utbl td:last-child{border-bottom:none;justify-content:flex-end}
  .utbl td::before{content:attr(data-label);font-size:10px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em;flex-shrink:0;min-width:80px}
  .utbl td[data-label] input,.utbl td[data-label] select{flex:1;min-width:0}
  .ext-inp{width:80px!important}
  .pin-inp{width:80px!important}
  .tbl-wrap{border:none}
  .card-wide{width:100%;max-width:100%;left:0;transform:none;position:static}
  .utbl-toolbar{margin-bottom:14px}
}

/* LIVE SUMMARY SIDEBAR (step 3 only, wide screens) */
@media(min-width:1200px){
  #callsSummaryCard{
    position:fixed;
    top:96px;
    bottom:96px;
    left:calc(50% + 400px);
    width:280px;
    overflow-y:auto;
    z-index:60;
    margin-bottom:0;
  }
  #callsSummaryCard .card-sub{font-size:12px}
  #callsSummaryCard .ibox{font-size:12.5px;line-height:1.6}
}

/* RING GROUPS & VMAILS */
.rg-card,.vm-card{border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:12px;background:rgba(79,138,255,0.03);transition:border-color .2s}
.rg-card:hover,.vm-card:hover{border-color:var(--bd-h)}
.ring-btn{background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:7px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--tx2);cursor:pointer;font-family:inherit;transition:all .2s;white-space:nowrap}
.ring-btn:hover{border-color:var(--pri);color:var(--pri)}
.ring-btn.active{background:rgba(79,138,255,.15);border-color:var(--pri);color:var(--pri);box-shadow:0 0 10px var(--pri-glow)}
</style>
</head>

function render(){

  document.getElementById('navBar').style.display='';

  if(S.step===STEPS.length-1){nb.textContent='Submit ✓';nb.className='btn btn-sub';}

  var fns=[step1,step2,step3,step4,step5];
  try{
    document.getElementById('content').innerHTML=fns[S.step]();

    console.error('Step '+(S.step+1)+' render error:',err.message,err);

  }).join('');

function importUsersCSV(inp){
  var f=inp.files[0];if(!f){return;}
  var reader=new FileReader();
  reader.onload=function(ev){
    save();
    var lines=String(ev.target.result).split(/\r\n|\r|\n/).map(function(l){return l.trim();}).filter(function(l){return l.length;});
    if(lines.length&&/^first\b/i.test((lines[0].split(',')[0]||'').trim()))lines.shift();
    var exts=S.users.map(function(u){return parseInt(u.ext);}).filter(function(n){return !isNaN(n);});
    var nextExt=exts.length?Math.max.apply(null,exts)+1:201;
    var devMap={'app':'App','desk phone':'Desk Phone','deskphone':'Desk Phone','both':'Both'};
    var vmMap={'both':'both','email only':'email','email':'email','mailbox only':'mailbox','mailbox':'mailbox'};
    var locLabels=(S.e911Locations||[]).map(function(l){return l.label;}).filter(Boolean);
    var added=[];
    lines.forEach(function(line){
      var c=line.split(',').map(function(s){return s.trim();});
      if(!c[0]&&!c[1]&&!c[2])return;
      var devKey=(c[4]||'').toLowerCase();
      var vmKey=(c[7]||'').toLowerCase();
      var locRaw=(c[9]||'Primary').trim();
      var locMatch=(locRaw.toLowerCase()==='primary')?'Primary':(locLabels.find(function(l){return l.toLowerCase()===locRaw.toLowerCase();})||'Primary');
      var ext=(c[3]||'').replace(/\D/g,'')||String(nextExt++);
      added.push({fn:c[0]||'',ln:c[1]||'',email:c[2]||'',ext:ext,dev:devMap[devKey]||'App',model:c[5]||'',mac:c[6]||'',vmailPref:vmMap[vmKey]||'both',pin:c[8]||'1357',officeLoc:locMatch});
    });
    if(added.length){
      added.forEach(function(u){S.users.push(u);});
      document.getElementById('ubody').insertAdjacentHTML('beforeend',added.map(urow).join(''));
      bind();
    }else{
      alert('No rows found in that file. Make sure it matches the template format (download the template first).');
    }
    inp.value='';
  };
  reader.readAsText(f);
}

/* ── Build the canonical number list from Step 1, and keep a routing entry per number ── */
function refreshNumbers(){
  var list=[];
  (S.localNums||'').split(/[\n,;]+/).map(function(s){return s.trim();}).filter(function(s){return s.replace(/\D/g,'').length>=10;}).forEach(function(num,i){
    list.push({key:'pl'+i,num:num,type:'port-local',carrier:S.localCarrier,authName:S.localAuthName});
  });
  (S.tfNums||'').split(/[\n,;]+/).map(function(s){return s.trim();}).filter(function(s){return s.replace(/\D/g,'').length>=10;}).forEach(function(num,i){
    list.push({key:'pt'+i,num:num,type:'port-tf',carrier:S.tfCarrier,authName:S.tfAuthName});
  });
  if(S.getNew){
    var qty=Math.max(1,parseInt(S.newQty)||1);
    for(var i=0;i<qty;i++){
      list.push({key:'nw'+i,num:'New number #'+(i+1)+(S.newPrimaryAC?' (area code '+S.newPrimaryAC+')':''),type:'new',state:S.newState,primaryAC:S.newPrimaryAC,backupAC:S.newBackupAC,qty:1});
    }
  }
  S.numbers=list;
  if(!S.numberRouting)S.numberRouting={};
  var keys=list.map(function(n){return n.key;});
  Object.keys(S.numberRouting).forEach(function(k){if(keys.indexOf(k)<0)delete S.numberRouting[k];});
  list.forEach(function(n){if(!S.numberRouting[n.key])S.numberRouting[n.key]={mode:'',ext:'',groupId:'',greetingId:'',noAnswer:{type:'vm',vmExt:'',outsideNum:''}};});
  return list;
}

/* ── Make sure there's always at least one group and one greeting to point numbers at ── */
function ensureCallSetupDefaults(){
  refreshNumbers();
  if(!S.groups)S.groups=[];
  if(!S.greetings)S.greetings=[];
  if(S.groups.length===0){
    var exts=S.users.map(function(u){return u.ext;});
    S.groups=[{id:'grp0',name:'Main Team',members:exts,ringType:'sim',ringDuration:20,noAnswer:{type:'vm',vmExt:'',outsideNum:''}}];
  }
  if(S.greetings.length===0){
    var cn=S.cnam||(S.companyName||'').toUpperCase()||'[Company Name]';
    S.greetings=[{id:'grt0',name:'Main Greeting',script:GREETING_TEMPLATES[0].replace(/\[Company Name\]/g,cn),tplIdx:0}];
  }
  (S.numbers||[]).forEach(function(n){
    var r=S.numberRouting[n.key];
    if(r&&!r.mode){r.mode='group';r.groupId=S.groups[0].id;}
  });
}

function naSummary(na){
  na=na||{type:'vm'};
  if(na.type==='outside')return 'rings '+(na.outsideNum?e(na.outsideNum):'an outside number you haven’t entered yet');
  if(na.type==='uservm'){var u=(S.users||[]).find(function(x){return x.ext===na.vmExt;});return u?('goes to '+(u.fn||'their')+'’s voicemail'):'goes to another person’s voicemail (not chosen yet)';}
  return 'goes to voicemail';
}

/* ── Greeting cards ── */
function renderGreeting(g,i){
  return '<div class="rg-card" data-gri="'+i+'">'
    +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">'
    +'<input class="grt-name" oninput="onGreetingNameInput(this)" placeholder="Greeting name (e.g. Main Greeting, Sales Line)" value="'+e(g.name||'')+'" style="flex:1;border:1px solid var(--inp-bd);border-radius:7px;padding:8px 12px;font-size:14px;font-family:inherit;color:var(--tx);background:var(--inp)">'
    +'<button class="del-btn" onclick="delGreeting(this)" title="Remove">&times;</button></div>'
    +'<textarea class="grt-script sample-area" rows="4" placeholder="What callers hear when this greeting plays">'+e(g.script||'')+'</textarea>'
    +'<button type="button" class="add-row-btn" onclick="cycleGreetingTemplate(this,'+i+')" style="margin-top:2px">&#128260; Try another starting point</button>'
    +'</div>';
}
function saveGreetings(){
  var cards=document.querySelectorAll('#greetingCards .rg-card');
  if(!cards.length)return;
  S.greetings=Array.from(cards).map(function(c,i){
    var existing=S.greetings&&S.greetings[parseInt(c.dataset.gri)];
    return {
      id:existing?existing.id:('grt'+Date.now()+'_'+i),
      name:c.querySelector('.grt-name')?c.querySelector('.grt-name').value:'',
      script:c.querySelector('.grt-script')?c.querySelector('.grt-script').value:'',
      tplIdx:existing?(existing.tplIdx||0):0
    };
  });
}
function addGreeting(){
  saveGreetings();
  var cn=S.cnam||(S.companyName||'').toUpperCase()||'[Company Name]';
  S.greetings.push({id:'grt'+Date.now(),name:'',script:GREETING_TEMPLATES[0].replace(/\[Company Name\]/g,cn),tplIdx:0});
  document.getElementById('greetingCards').innerHTML=S.greetings.map(renderGreeting).join('');
  refreshNumRouteUI();
}
function delGreeting(btn){
  btn.closest('.rg-card').remove();saveGreetings();
  refreshNumRouteUI();
}
function cycleGreetingTemplate(btn,i){
  saveGreetings();
  var g=S.greetings[i];if(!g)return;
  g.tplIdx=((g.tplIdx||0)+1)%GREETING_TEMPLATES.length;
  var cn=S.cnam||(S.companyName||'').toUpperCase()||'[Company Name]';
  g.script=GREETING_TEMPLATES[g.tplIdx].replace(/\[Company Name\]/g,cn);
  var card=btn.closest('.rg-card');
  if(card&&card.querySelector('.grt-script'))card.querySelector('.grt-script').value=g.script;
}

/* ── Group cards ── */
function renderGroup(g,i){
  var chips=(S.users||[]).map(function(u){
    var on=g.members&&g.members.indexOf(u.ext)>=0;
    return '<span class="ext-chip'+(on?' on':'')+'" data-ext="'+u.ext+'" onclick="toggleGroupMember(this)">'+u.ext+(u.fn?' – '+u.fn:'')+'</span>';
  }).join('');
  var durOpts=[15,20,25,30].map(function(s){
    var rings=s===15?'3':s===20?'3–4':s===25?'4':'5';
    return '<option value="'+s+'"'+(g.ringDuration===s?' selected':'')+'>'+s+' sec ≈ '+rings+' rings</option>';
  }).join('');
  return '<div class="rg-card" data-gi="'+i+'">'
    +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">'

    +'<button class="del-btn" onclick="delGroup(this)" title="Remove">&times;</button></div>'
    +'<div style="font-size:10.5px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">Members <span style="font-weight:400;text-transform:none;opacity:.7">(click to add or remove)</span></div>'
    +(chips||'<span style="font-size:13px;color:var(--tx3);font-style:italic">Add team members in Step 2 first</span>')
    +((g.members&&g.members.length)?'':'<div style="margin-top:8px;font-size:12px;color:var(--red);font-weight:600">&#9888;&#65039; No one’s in this group yet — calls sent here won’t ring anyone until you add at least one person.</div>')
    +'<div style="display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:12px;margin-top:14px">'
    +'<div><div style="font-size:10.5px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px">Ring pattern</div>'
    +'<div style="display:flex;gap:6px">'
    +'<button type="button" class="ring-btn'+(g.ringType==='sim'?' active':'')+'" onclick="setGroupRingType(this,\'sim\','+i+')">All at once</button>'
    +'<button type="button" class="ring-btn'+(g.ringType==='seq'?' active':'')+'" onclick="setGroupRingType(this,\'seq\','+i+')">One at a time</button>'
    +'</div></div>'
    +'<div><div style="font-size:10.5px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px">Ring for</div>'
    +'<select class="grp-dur" style="width:100%;border:1px solid var(--inp-bd);border-radius:7px;padding:7px 10px;font-size:13px;font-family:inherit;color:var(--tx);background:var(--inp)">'+durOpts+'</select></div>'
    +'<div><div style="font-size:10.5px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px">If no answer</div>'+naBlock(g.noAnswer)+'</div>'
    +'</div></div>';
}
function saveGroups(){
  var cards=document.querySelectorAll('#groupCards .rg-card');
  if(!cards.length)return;
  S.groups=Array.from(cards).map(function(c,i){
    var members=Array.from(c.querySelectorAll('.ext-chip.on')).map(function(x){return x.dataset.ext;});
    var rbtn=c.querySelector('.ring-btn.active');
    var dur=c.querySelector('.grp-dur');
    var existing=S.groups&&S.groups[parseInt(c.dataset.gi)];
    return {
      id:existing?existing.id:('grp'+Date.now()+'_'+i),
      name:c.querySelector('.grp-name')?c.querySelector('.grp-name').value:'',
      members:members,
      ringType:rbtn?(rbtn.textContent.indexOf('once')>=0?'sim':'seq'):'sim',
      ringDuration:dur?parseInt(dur.value)||20:20,
      noAnswer:readNaBlock(c.querySelector('.na-wrap'))
    };
  });
}
function addGroup(){
  saveGroups();
  S.groups.push({id:'grp'+Date.now(),name:'',members:[],ringType:'sim',ringDuration:20,noAnswer:{type:'vm',vmExt:'',outsideNum:''}});
  document.getElementById('groupCards').innerHTML=S.groups.map(renderGroup).join('');
  refreshNumRouteUI();
}
function delGroup(btn){
  btn.closest('.rg-card').remove();saveGroups();
  refreshNumRouteUI();
}
function setGroupRingType(btn,type,i){
  btn.closest('.rg-card').querySelectorAll('.ring-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  saveGroups();
}
function toggleGroupMember(chip){chip.classList.toggle('on');saveGroups();}

/* ── Per-number routing rows ── */
function isNumRouteIncomplete(r){
  if(!r||!r.mode)return true;
  if(r.mode==='user'&&!r.ext)return true;
  if(r.mode==='group'){
    if(!r.groupId)return true;
    var g=(S.groups||[]).find(function(x){return x.id===r.groupId;});
    if(!g||!g.members||!g.members.length)return true;
  }
  if(r.mode==='greeting'&&!r.greetingId)return true;
  return false;
}
function getIncompleteNumbers(){
  return (S.numbers||[]).filter(function(n){return isNumRouteIncomplete(S.numberRouting[n.key]);});
}
function renderNumRoute(n){
  var r=S.numberRouting[n.key]||{mode:'',ext:'',groupId:'',greetingId:'',noAnswer:{type:'vm',vmExt:'',outsideNum:''}};
  var incomplete=isNumRouteIncomplete(r);
  var tl={'port-local':'Transfer – Local','port-tf':'Transfer – Toll-free','new':'New number'}[n.type]||n.type;
  var selStyle='border:1px solid var(--inp-bd);border-radius:7px;padding:7px 10px;font-size:13px;font-family:inherit;color:var(--tx);background:var(--inp)';
  var userOpts=(S.users||[]).map(function(u){var l=(u.fn||('Ext '+u.ext))+(u.ln?' '+u.ln:'');return '<option value="'+u.ext+'"'+(r.ext===u.ext?' selected':'')+'>'+e(l)+'</option>';}).join('');
  var groupOpts=(S.groups||[]).map(function(g){return '<option value="'+g.id+'"'+(r.groupId===g.id?' selected':'')+'>'+e(g.name||'Unnamed group')+'</option>';}).join('');
  var greetOpts=(S.greetings||[]).map(function(g){return '<option value="'+g.id+'"'+(r.greetingId===g.id?' selected':'')+'>'+e(g.name||'Unnamed greeting')+'</option>';}).join('');
  var targetHtml='';
  if(r.mode==='user')targetHtml='<select class="nr-target nr-user" style="'+selStyle+'" onchange="saveNumberRouting();refreshNumRouteUI();">'
    +'<option value="">Choose person…</option>'+userOpts+'</select>';
  else if(r.mode==='group')targetHtml=(S.groups&&S.groups.length)
    ?('<select class="nr-target nr-group" style="'+selStyle+'" onchange="nrTargetChange(this,\''+n.key+'\')"><option value="">Choose group…</option>'+groupOpts+'<option value="__new__">&#10011; Create a new group…</option></select>')
    :'<button type="button" class="add-row-btn" onclick="nrQuickAdd(\''+n.key+'\',\'group\')" style="margin-top:2px">+ Create your first group</button>';
  else if(r.mode==='greeting')targetHtml=(S.greetings&&S.greetings.length)
    ?('<select class="nr-target nr-greeting" style="'+selStyle+'" onchange="nrTargetChange(this,\''+n.key+'\')"><option value="">Choose greeting…</option>'+greetOpts+'<option value="__new__">&#10011; Create a new greeting…</option></select>')
    :'<button type="button" class="add-row-btn" onclick="nrQuickAdd(\''+n.key+'\',\'greeting\')" style="margin-top:2px">+ Create your first greeting</button>';
  var naHtml=r.mode==='user'?('<div style="margin-top:10px"><div style="font-size:10.5px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px">If no answer</div>'+naBlock(r.noAnswer)+'</div>'):'';
  var noteHtml=r.mode==='greeting'?'<div class="ibox amber" style="margin-top:10px;margin-bottom:0"><strong>&#128222; We’ll finish this on a call.</strong>What happens on each key press (press 1, press 2, etc.) for this greeting gets configured together with your onboarding specialist.</div>':'';
  var warnHtml=incomplete?'<div style="margin-top:10px;font-size:12px;color:var(--red);font-weight:700;display:flex;align-items:center;gap:6px">&#9888;&#65039; Not set up yet — choose where this number should ring, all the way through.</div>':'';
  return '<div class="nr-row'+(incomplete?' nr-incomplete':'')+'" data-nkey="'+n.key+'" style="border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:rgba(255,255,255,.02)">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap">'
    +'<div><div style="font-size:14px;font-weight:700;color:var(--tx)">'+e(n.num)+'</div><div style="font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em">'+tl+'</div></div>'
    +'<select class="nr-mode" style="'+selStyle+'" onchange="numRouteModeChange(this,\''+n.key+'\')">'
    +'<option value="">Choose how this rings…</option>'
    +'<option value="user"'+(r.mode==='user'?' selected':'')+'>A specific person</option>'
    +'<option value="group"'+(r.mode==='group'?' selected':'')+'>A group of people</option>'
    +'<option value="greeting"'+(r.mode==='greeting'?' selected':'')+'>A greeting / auto-attendant</option>'
    +'</select></div>'
    +'<div class="nr-target-wrap">'+targetHtml+'</div>'
    +naHtml+noteHtml+warnHtml
    +'</div>';
}
function refreshNumRouteUI(){
  var el=document.getElementById('numRouteRows');
  if(el)el.innerHTML=(S.numbers||[]).map(renderNumRoute).join('');
  var banner=document.getElementById('numRouteBanner');
  if(banner)banner.outerHTML=numRouteBannerHtml();
}
function numRouteBannerHtml(){
  var incomplete=getIncompleteNumbers();
  if(!incomplete.length){
    return '<div class="ibox green" id="numRouteBanner" style="margin-bottom:14px"><strong>&#9989; All set — every number has somewhere to ring.</strong></div>';
  }
  var links=incomplete.map(function(n){return '<a onclick="scrollToNumRoute(\''+n.key+'\')" style="text-decoration:underline;cursor:pointer;font-weight:700">'+e(n.num)+'</a>';}).join(', ');
  return '<div class="ibox red" id="numRouteBanner" style="margin-bottom:14px"><strong>&#9888;&#65039; '+incomplete.length+' of '+(S.numbers||[]).length+' number'+((S.numbers||[]).length===1?'':'s')+' still need'+(incomplete.length===1?'s':'')+' to be finished.</strong>Every number needs somewhere to ring before you can submit: '+links+'.</div>';
}
function scrollToNumRoute(key){
  var row=document.querySelector('.nr-row[data-nkey="'+key+'"]');
  if(!row)return;
  row.scrollIntoView({behavior:'smooth',block:'center'});
  row.classList.add('nr-flash');
  setTimeout(function(){row.classList.remove('nr-flash');},2000);
}
function nrTargetChange(sel,key){
  if(sel.value==='__new__'){
    var kind=sel.classList.contains('nr-group')?'group':'greeting';
    nrQuickAdd(key,kind);
  }else{
    saveNumberRouting();
    refreshNumRouteUI();
  }
}
function nrQuickAdd(key,kind){
  saveNumberRouting();
  if(kind==='group'){
    addGroup();
    var ng=S.groups[S.groups.length-1];
    var entry=S.numberRouting[key];
    if(entry){entry.mode='group';entry.groupId=ng.id;}
    refreshNumRouteUI();
    setTimeout(function(){
      var nameInp=document.querySelector('#groupCards .rg-card:last-child .grp-name');
      if(nameInp){nameInp.closest('.rg-card').scrollIntoView({behavior:'smooth',block:'center'});nameInp.focus();}
    },60);
  }else{
    addGreeting();
    var ngr=S.greetings[S.greetings.length-1];
    var entry=S.numberRouting[key];
    if(entry){entry.mode='greeting';entry.greetingId=ngr.id;}
    refreshNumRouteUI();
    setTimeout(function(){
      var nameInp=document.querySelector('#greetingCards .rg-card:last-child .grt-name');
      if(nameInp){nameInp.closest('.rg-card').scrollIntoView({behavior:'smooth',block:'center'});nameInp.focus();}
    },60);
  }
}
function onGroupNameInput(inp){
  var i=parseInt(inp.closest('.rg-card').dataset.gi);
  if(S.groups[i])S.groups[i].name=inp.value;
  refreshNumRouteUI();
}
function onGreetingNameInput(inp){
  var i=parseInt(inp.closest('.rg-card').dataset.gri);
  if(S.greetings[i])S.greetings[i].name=inp.value;
  refreshNumRouteUI();
}
function numRouteModeChange(sel,key){
  saveNumberRouting();
  if(!S.numberRouting[key])S.numberRouting[key]={mode:'',ext:'',groupId:'',greetingId:'',noAnswer:{type:'vm',vmExt:'',outsideNum:''}};
  S.numberRouting[key].mode=sel.value;
  refreshNumRouteUI();
}
function saveNumberRouting(){
  Array.from(document.querySelectorAll('.nr-row')).forEach(function(row){
    var key=row.dataset.nkey;
    var mode=row.querySelector('.nr-mode')?row.querySelector('.nr-mode').value:'';
    var entry=S.numberRouting[key]||{mode:'',ext:'',groupId:'',greetingId:'',noAnswer:{type:'vm',vmExt:'',outsideNum:''}};
    entry.mode=mode;
    if(mode==='user'){
      var us=row.querySelector('.nr-user');if(us)entry.ext=us.value;
      entry.noAnswer=readNaBlock(row.querySelector('.na-wrap'));
    }else if(mode==='group'){
      var gs=row.querySelector('.nr-group');if(gs)entry.groupId=gs.value;
    }else if(mode==='greeting'){
      var gr=row.querySelector('.nr-greeting');if(gr)entry.greetingId=gr.value;
    }
    S.numberRouting[key]=entry;
  });
}

  document.querySelectorAll('.play-btn').forEach(function(b){b.innerHTML='&#9654; Preview';b.classList.remove('playing');});
  var v=VOICES.find(function(x){return x.name===name;});if(!v)return;

function getSubmitBlockers(){
  var b=[];
  if(!(S.companyName||'').trim())b.push({msg:'Company name is missing.',step:0});
  if(!S.portLocal&&!S.portTF&&!S.getNew)b.push({msg:'No phone numbers selected — choose at least one: port existing numbers or get new ones.',step:0});
  if(S.portLocal){
    var localList=(S.numbers||[]).filter(function(n){return n.type==='port-local';});
    if(!localList.length)b.push({msg:'You checked “Transfer my existing local numbers” but haven’t entered any numbers to port.',step:0});
    if(!(S.localCarrier||'').trim())b.push({msg:'Local port: current carrier is missing.',step:0});
    if(!(S.localAcctNum||'').trim())b.push({msg:'Local port: account number is missing — carriers require this to process the port.',step:0});
    if(!S.loaSigDrawn)b.push({msg:'The LOA hasn’t been signed yet — draw your signature in Step 1.',step:0});
  }
  if(S.portTF){
    var tfList=(S.numbers||[]).filter(function(n){return n.type==='port-tf';});
    if(!tfList.length)b.push({msg:'You checked “Transfer my toll-free numbers” but haven’t entered any numbers to port.',step:0});
    if(!(S.respStreet||'').trim()||!(S.respCity||'').trim())b.push({msg:'Toll-free authorization: address is incomplete.',step:0});
    if(!S.respSigDrawn)b.push({msg:'The Resporg form hasn’t been signed yet — draw your signature in Step 1.',step:0});
  }
  if(!(S.e911Street||'').trim()||!(S.e911City||'').trim()||!(S.e911State||'').trim()||!(S.e911Zip||'').trim())b.push({msg:'E911 address is incomplete — required by law for emergency dispatch.',step:0});
  var namedUsers=(S.users||[]).filter(function(u){return (u.fn||'').trim()||(u.ln||'').trim();});
  if(!namedUsers.length)b.push({msg:'No team members have names entered yet — add at least one person in Your Team.',step:1});
  getTeamBlockers().forEach(function(m){b.push({msg:m,step:1});});
  var inc=getIncompleteNumbers().length;
  if(inc)b.push({msg:inc+' phone number'+(inc===1?'':'s')+' still need'+(inc===1?'s':'')+' to be routed — finish “Where Each Number Rings” in Call Setup.',step:2});
  return b;
}
function getSubmitWarnings(){
  var w=[];
  if(S.smsOn){

  if(S.portLocal&&!S.billFileData)w.push({msg:'No phone bill uploaded for your local port — carriers typically require this.',step:0});
  if(S.portTF&&!S.respBillFileData)w.push({msg:'No invoice uploaded for your toll-free transfer.',step:0});
  var deskMissing=(S.users||[]).filter(function(u){return u.dev==='Desk Phone'&&(!(u.model||'').trim()||!(u.mac||'').trim());}).length;
  if(deskMissing)w.push({msg:deskMissing+' desk-phone user'+(deskMissing===1?'':'s')+' missing a model or MAC address (leave blank only if UNICOM is shipping the phone).',step:1});
  return w;
}

async function submitData(){
  var W='https://hooks.zapier.com/hooks/catch/28885988/4dznowb/';
  var payload=Object.assign({},S,{submittedAt:new Date().toISOString()});
  // Auto-generate the signed LOA / Resporg PDFs at submit time (independent of
  // whether the client used the "Download" buttons in Step 1), so the emailed
  // copy always reflects exactly what they filled in.
  if(S.portLocal){var loaBuilt=buildLOADoc();if(loaBuilt){payload.loaPdfBase64=loaBuilt.doc.output('datauristring');payload.loaPdfFilename=loaBuilt.filename;lastSubmittedDocs.loa=loaBuilt;}}
  if(S.portTF){var respBuilt=buildRespDoc();if(respBuilt){payload.respPdfBase64=respBuilt.doc.output('datauristring');payload.respPdfFilename=respBuilt.filename;lastSubmittedDocs.resp=respBuilt;}}
  if(!W)return;
  try{await fetch(W,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});}catch(err){console.error(err);}
}
function previewSubmittedDoc(kind){
  var built=lastSubmittedDocs[kind];
  if(!built){alert('That document isn\'t available for this submission.');return;}
  window.open(built.doc.output('bloburl'),'_blank');
}
function downloadSubmittedDoc(kind){
  var built=lastSubmittedDocs[kind];
  if(!built){alert('That document isn\'t available for this submission.');return;}
  built.doc.save(built.filename);
}

function dlCSV(){
  save();
  refreshNumbers();
  var dom=gv('ssDomain')||S.ssDomain||'[DOMAIN].service';
  var mn=S.numbers.filter(function(n){return n.type!=='new';}).map(function(n){return n.num.replace(/\D/g,'');}).filter(Boolean)[0]||'';
  var ac=mn.substring(0,3);
  var vm={both:'attnew',email:'yes',mailbox:'no'};
  var hdrs=['extension*','domain','first name*','last name*','login','portal password','email address','voicemail pin','department','site','vmail enabled','answer timeout','timezone','area code','callerid number','callerid name','911 callerid','dial plan','dial permission','audio directory','visual directory','vmail_transcribe','email_vmail','add phone extension','scope'];
  var rows=S.users.map(function(u){
    var login=u.email||(u.ext+'@'+dom);
    return [u.ext,dom,u.fn,u.ln,login,'',u.email,u.pin||'1357','','','yes','25',S.timezone||'US/Eastern',ac,mn,S.cnam||'',mn,dom,'US and Canada','yes','yes','no',vm[u.vmailPref||'both']||'attnew','yes','Basic User'];
  });
  var csv=[hdrs].concat(rows).map(function(r){return r.map(function(f){return '"'+String(f||'').replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='users_import.csv';a.click();
}

function drawBrandHeader(doc,title,subtitle){
  var pageW=216,stripeH=4,steps=72,c1=[87,123,189],c2=[161,182,247];
  for(var i=0;i<steps;i++){
    var t=i/(steps-1);
    var r=Math.round(c1[0]+(c2[0]-c1[0])*t),g=Math.round(c1[1]+(c2[1]-c1[1])*t),b=Math.round(c1[2]+(c2[2]-c1[2])*t);
    doc.setFillColor(r,g,b);doc.rect(i*(pageW/steps),0,(pageW/steps)+0.6,stripeH,'F');
  }
  var logoW=58,logoH=logoW*(527/2908);
  try{doc.addImage(LOGO_BASE64,'JPEG',15,9,logoW,logoH);}catch(e){}
  var tx=15+logoW+7;
  doc.setTextColor(30,41,59);doc.setFont('helvetica','bold');doc.setFontSize(11);
  doc.text(title,tx,16,{maxWidth:pageW-tx-15});
  doc.setTextColor(100,100,100);doc.setFont('helvetica','normal');doc.setFontSize(8);
  var sp=doc.splitTextToSize(subtitle,pageW-tx-15);doc.text(sp,tx,22);
  doc.setDrawColor(220,220,220);doc.setLineWidth(0.3);doc.line(15,34,201,34);
  doc.setTextColor(0,0,0);
  return 42;
}
function drawBrandFooter(doc){
  doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(140,140,140);
  doc.text('UNICOM TELECOM, INC.  \u2022  973-750-4200  \u2022  unicomtelecom.com',108,272,{align:'center'});
  doc.setTextColor(0,0,0);
}
function docMissingBannerHtml(id,missing){
  missing=missing||[];
  return '<div class="ibox red" id="'+id+'" style="margin-bottom:12px'+(missing.length?'':';display:none')+'">'
    +(missing.length?'&#9888;&#65039; Before downloading: <strong>'+missing.map(function(m){return e(m.label);}).join(', ')+'</strong> still '+(missing.length===1?'needs':'need')+' to be filled in, or this PDF will have blank lines where a carrier expects your info.':'')
    +'</div>';
}
function refreshDocBanners(){
  var lb=document.getElementById('loaMissingBanner');
  if(lb)lb.outerHTML=docMissingBannerHtml('loaMissingBanner',getLoaMissing());
  var rb=document.getElementById('respMissingBanner');
  if(rb)rb.outerHTML=docMissingBannerHtml('respMissingBanner',getRespMissing());
}
function getLoaMissing(){
  var m=[];
  if(!(S.companyName||'').trim())m.push({label:'Company Name',id:'companyName'});
  if(!(S.localCarrier||'').trim())m.push({label:'Current Carrier',id:'localCarrier'});
  if(!(S.localAcctNum||'').trim())m.push({label:'Account Number',id:'localAcctNum'});
  var localList=(S.localNums||'').split(/[\n,;]+/).map(function(s){return s.trim();}).filter(function(s){return s.replace(/\D/g,'').length>=10;});
  if(!localList.length)m.push({label:'Numbers to Port',id:'localNums'});
  if(!S.loaSigDrawn)m.push({label:'Your Signature',id:'loaCvs'});
  return m;
}
function getRespMissing(){
  var m=[];
  if(!(S.companyName||'').trim())m.push({label:'Company Name',id:'companyName'});
  if(!((S.respStreet||S.e911Street)||'').trim())m.push({label:'Street Address',id:'respStreet'});
  else if(!((S.respCity||S.e911City)||'').trim()||!((S.respState||S.e911State)||'').trim()||!((S.respZip||S.e911Zip)||'').trim())m.push({label:'City/State/Zip',id:'respCity'});
  var tfn=(S.tfNums||'').split(/[\n,;]+/).map(function(s){return s.trim();}).filter(function(s){return s.replace(/\D/g,'').length>=10;});
  if(!tfn.length)m.push({label:'Toll-Free Numbers',id:'tfNums'});
  if(!S.respSigDrawn)m.push({label:'Your Signature',id:'respCvs'});
  return m;
}
function buildLOADoc(){
  if(typeof window.jspdf==='undefined')return null;
  var doc=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'letter'});
  var today=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  // Parse local numbers from textarea
  var localNumList=(S.localNums||'').split(/[\n,;]+/).map(function(s){return s.trim();}).filter(function(s){return s.replace(/\D/g,'').length>=10;});
  var btn=localNumList[0]||'';
  var y=drawBrandHeader(doc,'Letter of Authorization (LOA)','Customer Service Records (CSR) Request \u2014 Local Number Port');
  doc.setFontSize(8.5);
  var pre='For each of the telephone numbers listed herein, I appoint Unicom Telecom, Inc to act as my Agent for the purpose of collecting my account information with my current local telephone carrier or provider (hereinafter "Provider"). By selecting Unicom Telecom, Inc to act as my Agent to research my current services with my current Provider of local telephone service, I am authorizing the change of my local telephone Provider from that/those which I am currently using to Unicom Telecom, Inc. This authorization will expire with written notification only.';
  var sp=doc.splitTextToSize(pre,180);doc.text(sp,15,y);y+=sp.length*3.8+4;
  doc.setTextColor(180,0,0);doc.setFont('helvetica','bold');
  doc.text('IMPORTANT: All information must match your current carrier invoice exactly.',15,y,{maxWidth:180});y+=7;
  doc.setTextColor(0,0,0);doc.setFont('helvetica','normal');
  doc.setTextColor(0,0,0);doc.setFont('helvetica','bold');doc.setFontSize(10);
  doc.text('Company Information (as appears on your current phone bill)',15,y);y+=6;
  doc.setFont('helvetica','normal');doc.setFontSize(9);
  function af(l,v){doc.setFont('helvetica','bold');doc.text(l+':',15,y);doc.setFont('helvetica','normal');doc.text(v||'________________________',75,y);y+=7;}
  af('Company Name',S.companyName);
  af('Service Address',S.loaServiceStreet);
  af('City / State / Zip',[S.loaServiceCity,S.loaServiceState,S.loaServiceZip].filter(Boolean).join(', '));
  y+=2;doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text('Account Details',15,y);y+=6;doc.setFontSize(9);
  af('Main Number on Your Bill',btn);
  af('Losing Carrier',S.localCarrier||'');
  af('Losing Carrier Account Number',S.localAcctNum||'');
  y+=3;doc.setFont('helvetica','bold');doc.setFontSize(10);
  doc.text('Attachment A \u2014 Numbers to Port',15,y);y+=5;doc.setFont('helvetica','normal');doc.setFontSize(8.5);
  doc.text('Include all numbers on this BTN. Do NOT include toll-free numbers \u2014 use a Resporg for those.',15,y,{maxWidth:180});y+=7;
  localNumList.forEach(function(n){if(n){doc.text(n,15,y);y+=5;}});
  y+=4;doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text('Authorized Signature',15,y);y+=4;
  if(S.loaSigData&&S.loaSigData.length>100){try{doc.addImage(S.loaSigData,S.loaSigData.indexOf('image/jpeg')>-1?'JPEG':'PNG',15,y,90,28);y+=32;}catch(er){doc.line(15,y+15,105,y+15);y+=20;}}
  else{doc.line(15,y+15,105,y+15);y+=20;}
  doc.setFontSize(9);
  af('Date',today);
  af('Print Name',[S.loaSignerFn||S.contactFn,S.loaSignerLn||S.contactLn].filter(Boolean).join(' '));
  drawBrandFooter(doc);
  var filename='UNICOM_LOA_'+(S.companyName||'Form').replace(/[^a-zA-Z0-9]/g,'_')+'_'+new Date().toISOString().split('T')[0]+'.pdf';
  return {doc:doc,filename:filename};
}
function genLOA(){
  save();
  var missing=getLoaMissing();
  if(missing.length){
    var ok=confirm('This LOA is still missing:\n\n'+missing.map(function(m){return '• '+m.label;}).join('\n')+'\n\nThose will show as blank lines on the PDF, which is the #1 reason carriers reject a port. Download it anyway?');
    refreshDocBanners();
    if(!ok){
      setTimeout(function(){
        var el=document.getElementById(missing[0].id);
        if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.focus&&el.focus();el.classList.add('nr-flash');setTimeout(function(){el.classList.remove('nr-flash');},2000);}
      },50);
      return;
    }
  }
  var built=buildLOADoc();
  if(!built){alert('PDF library not loaded. Check your connection.');return;}
  built.doc.save(built.filename);
}

  af('Postal / Zip Code',S.respZip||S.e911Zip);
  af('Country',S.respCountry||'US');
  y+=3;doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text('TFN Line List \u2014 Toll-Free Numbers to Port',15,y);y+=5;
  doc.setFont('helvetica','normal');doc.setFontSize(9);
  doc.text('List all Toll Free Numbers to be ported (one per line)',15,y);y+=6;
  tfn.forEach(function(n){doc.text(n,15,y);y+=5;});
  y+=4;
  var leg='The undersigned customer ("Customer") hereby appoints Unicom Telecom, Inc to act as its authorized agent for all matters pertaining to the 8YY services listed above. This agency includes, the ordering of rearrangement of services, assignment to primary carrier services requests, disconnection of service and other requests as deemed necessary by Unicom Telecom, Inc to implement the 8YY services ordered from Unicom Telecom, Inc and itemized on Customer\'s Service Order Form(s) and associated attachments. This authorization will expire upon written notification only.';
  var sp=doc.splitTextToSize(leg,180);doc.text(sp,15,y);y+=sp.length*3.8+5;
  doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text('Authorized Signature',15,y);y+=4;
  if(S.respSigData&&S.respSigData.length>100){try{doc.addImage(S.respSigData,S.respSigData.indexOf('image/jpeg')>-1?'JPEG':'PNG',15,y,90,28);y+=32;}catch(er){doc.line(15,y+15,105,y+15);y+=20;}}
  else{doc.line(15,y+15,105,y+15);y+=20;}
  doc.setFontSize(9);
  af('Print Name',[S.respSignerFn||S.contactFn,S.respSignerLn||S.contactLn].filter(Boolean).join(' '));
  af('Title',S.respTitle);
  af('Date',today);
  drawBrandFooter(doc);
  var filename='UNICOM_Resporg_'+(S.companyName||'Form').replace(/[^a-zA-Z0-9]/g,'_')+'_'+new Date().toISOString().split('T')[0]+'.pdf';
  return {doc:doc,filename:filename};
}
function genResp(){
  save();
  var missing=getRespMissing();
  if(missing.length){
    var ok=confirm('This Resporg form is still missing:\n\n'+missing.map(function(m){return '• '+m.label;}).join('\n')+'\n\nThose will show as blank lines on the PDF. Download it anyway?');
    refreshDocBanners();
    if(!ok){
      setTimeout(function(){
        var el=document.getElementById(missing[0].id);
        if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.focus&&el.focus();el.classList.add('nr-flash');setTimeout(function(){el.classList.remove('nr-flash');},2000);}
      },50);
      return;
    }
  }
  var built=buildRespDoc();
  if(!built){alert('PDF library not loaded.');return;}
  built.doc.save(built.filename);
}

/* ===== SIGNATURE PAD ===== */
function initSig(id,cid,existing){
  var c=document.getElementById(cid);if(!c)return;
  var ctx=c.getContext('2d'),w=c.offsetWidth||680;
  c.width=w;c.height=120;
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);
  ctx.strokeStyle='#0a1628';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';
  if(existing&&existing.length>100){var img=new Image();img.onload=function(){ctx.drawImage(img,0,0,w,120);};img.src=existing;}
  var dwg=false;
  function pt(ev){var r=c.getBoundingClientRect(),src=ev.touches?ev.touches[0]:ev;return {x:(src.clientX-r.left)*(c.width/r.width),y:(src.clientY-r.top)*(c.height/r.height)};}
  c.addEventListener('mousedown',function(ev){dwg=true;S[id+'Drawn']=true;refreshDocBanners();var p=pt(ev);ctx.beginPath();ctx.moveTo(p.x,p.y);});
  c.addEventListener('mousemove',function(ev){if(!dwg)return;var p=pt(ev);ctx.lineTo(p.x,p.y);ctx.stroke();});
  c.addEventListener('mouseup',function(){dwg=false;});c.addEventListener('mouseleave',function(){dwg=false;});
  c.addEventListener('touchstart',function(ev){ev.preventDefault();dwg=true;S[id+'Drawn']=true;refreshDocBanners();var p=pt(ev);ctx.beginPath();ctx.moveTo(p.x,p.y);},{passive:false});
  c.addEventListener('touchmove',function(ev){ev.preventDefault();if(!dwg)return;var p=pt(ev);ctx.lineTo(p.x,p.y);ctx.stroke();},{passive:false});
  c.addEventListener('touchend',function(){dwg=false;});
  sigPads[id]={data:function(){return c.toDataURL('image/jpeg',0.92);},clear:function(){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);}};
}
function clrSig(id,cid){if(sigPads[id])sigPads[id].clear();if(id==='loaSig'){S.loaSigData='';S.loaSigDrawn=false;}else{S.respSigData='';S.respSigDrawn=false;}refreshDocBanners();}

/* ===== BIND ===== */
var DOC_BANNER_FIELD_IDS=['companyName','e911Street','e911City','e911State','e911Zip','loaServiceStreet','loaServiceCity','loaServiceState','loaServiceZip','localCarrier','localAcctNum','localNums','respStreet','respCity','respState','respZip','tfNums'];
function bindDocBannerLive(){
  var c=document.getElementById('content');
  if(!c||c.__docBannerBound)return;
  c.__docBannerBound=true;
  c.addEventListener('input',function(ev){
    if(S.step!==0||!ev.target||DOC_BANNER_FIELD_IDS.indexOf(ev.target.id)===-1)return;
    save();
    refreshDocBanners();
  });
}
function bind(){
  bindDocBannerLive();
  document.querySelectorAll('.ah-opt').forEach(function(o){
    o.addEventListener('click',function(){
      document.querySelectorAll('.ah-opt').forEach(function(x){x.classList.remove('selected');});
      this.classList.add('selected');
      var v=this.querySelector('input').value;
      var ff=document.getElementById('ahFwdF'),of=document.getElementById('ahOthF'),vf=document.getElementById('ahVmF');
      if(ff)ff.className='cond'+(v==='forward'?' show':'');
      if(of)of.className='cond'+(v==='other'?' show':'');
      if(vf)vf.className='cond'+(v==='voicemail'?' show':'');
    });
  });
}

/* ===== UTIL ===== */
function e(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function autoPopCNAM(inp){
  var cn=document.getElementById('cnam');if(!cn||cn.dataset.edited)return;
  var v=(inp.value||'').trim().substring(0,15).toUpperCase();
  cn.value=v;S.cnam=v;
  updateScriptPlaceholder(v);
}
function updateScriptPlaceholder(name){
  if(!name)return;
  var el=document.getElementById('afterScript');
  if(el&&el.value.indexOf('[Company Name]')>=0)el.value=el.value.replace(/\[Company Name\]/g,name);
  if(S.afterScript&&S.afterScript.indexOf('[Company Name]')>=0)S.afterScript=S.afterScript.replace(/\[Company Name\]/g,name);
  (S.greetings||[]).forEach(function(g){if(g.script&&g.script.indexOf('[Company Name]')>=0)g.script=g.script.replace(/\[Company Name\]/g,name);});
  document.querySelectorAll('.grt-script').forEach(function(ta){if(ta.value.indexOf('[Company Name]')>=0)ta.value=ta.value.replace(/\[Company Name\]/g,name);});
}

loadFromHash();
render();
