<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNICOM Telecom — Account Setup</title>
<style>
:root{
  --navy:#002B6B;--navy2:#003a8c;
  --amber-bg:#FEF3C7;--amber-bd:#B45309;--amber-tx:#92400E;
  --blue-bg:#DBEAFE;--blue-bd:#1D4ED8;--blue-tx:#1E40AF;
  --green-bg:#D1FAE5;--green:#059669;--green2:#047857;
  --red:#DC2626;--red-bg:#FEE2E2;
  --g50:#F9FAFB;--g100:#F3F4F6;--g200:#E5E7EB;--g300:#D1D5DB;
  --g500:#6B7280;--g700:#374151;--g900:#111827;
  --r:10px;--sh:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
  --shm:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -1px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,-apple-system,sans-serif;background:#EFF4F9;color:var(--g900);min-height:100vh}
.hdr{background:var(--navy);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shm)}
.hdr-l{font-size:17px;font-weight:700;color:#fff}
.hdr-sub{font-size:12px;color:rgba(255,255,255,.7);margin-top:1px}
.hdr-actions{display:flex;gap:8px;align-items:center}
.hdr-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);padding:7px 13px;border-radius:7px;text-decoration:none;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;font-family:Arial,sans-serif;transition:background .15s}
.hdr-btn:hover{background:rgba(255,255,255,.25)}
.save-toast{position:fixed;top:70px;right:20px;background:#1f2937;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.save-toast.show{opacity:1}
.wrap{max-width:740px;margin:0 auto;padding:22px 16px 90px}
.prog-wrap{background:#fff;border-radius:var(--r);padding:16px 20px;margin-bottom:18px;box-shadow:var(--sh)}
.prog-steps{display:flex;align-items:flex-start}
.prog-step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative}
.prog-step:not(:last-child)::after{content:'';position:absolute;top:14px;left:50%;width:100%;height:2px;background:var(--g200);z-index:0;transition:background .3s}
.prog-step.done:not(:last-child)::after{background:var(--green)}
.prog-num{width:28px;height:28px;border-radius:50%;background:var(--g200);color:var(--g500);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;transition:all .3s}
.prog-step.active .prog-num{background:var(--navy);color:#fff}
.prog-step.done .prog-num{background:var(--green);color:#fff}
.prog-label{font-size:9.5px;color:var(--g500);margin-top:5px;text-align:center;font-weight:500;line-height:1.3}
.prog-step.active .prog-label{color:var(--navy);font-weight:700}
.prog-step.done .prog-label{color:var(--green)}
.card{background:#fff;border-radius:var(--r);padding:24px 26px;box-shadow:var(--sh);margin-bottom:16px}
.card-title{font-size:18px;font-weight:700;color:var(--navy);padding-bottom:11px;border-bottom:2px solid var(--navy);margin-bottom:8px}
.card-sub{font-size:13.5px;color:var(--g500);margin-bottom:18px;line-height:1.5}
.ibox{border-left:4px solid var(--amber-bd);border-radius:6px;padding:12px 15px;margin-bottom:16px;font-size:13.5px;line-height:1.6}
.ibox.amber{background:var(--amber-bg);color:var(--amber-tx)}
.ibox.blue{background:var(--blue-bg);color:var(--blue-tx);border-color:var(--blue-bd)}
.ibox.red{background:var(--red-bg);color:#991b1b;border-color:var(--red)}
.ibox strong{display:block;margin-bottom:4px;font-weight:700}
.ibox a{color:inherit;font-weight:700}
.sbox{background:var(--blue-bg);border:1px solid var(--blue-bd);border-radius:7px;padding:14px 16px;margin-bottom:18px}
.sbox-label{font-size:11px;font-weight:700;color:var(--blue-tx);display:block;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.sbox textarea{width:100%;border:1px solid var(--blue-bd);border-radius:5px;padding:10px 12px;font-size:13.5px;font-family:Arial,sans-serif;line-height:1.6;color:var(--g900);background:#fff;resize:vertical;min-height:90px}
.sbox textarea:focus{outline:none;border-color:var(--navy)}
.field{margin-bottom:15px}
.field label,.field-label{display:block;font-size:13px;font-weight:600;color:var(--g700);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--g300);border-radius:7px;padding:9px 12px;font-size:14px;font-family:Arial,sans-serif;color:var(--g900);background:#fff;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(0,43,107,.1)}
.field textarea{resize:vertical;min-height:70px;line-height:1.5}
.field-hint{font-size:12px;color:var(--g500);margin-top:4px;line-height:1.4}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tbl-wrap{overflow-x:auto;margin-bottom:12px;border-radius:8px;border:1px solid var(--g200)}
.ntbl,.utbl{width:100%;border-collapse:collapse;font-size:13px}
.ntbl{min-width:500px}.utbl{min-width:620px}
.ntbl th,.utbl th{background:var(--navy);color:#fff;padding:10px 10px;text-align:left;font-weight:600;font-size:11.5px}
.ntbl td,.utbl td{padding:5px 5px;border-bottom:1px solid var(--g200);vertical-align:middle}
.ntbl tr:last-child td,.utbl tr:last-child td{border-bottom:none}
.ntbl tr:nth-child(even) td,.utbl tr:nth-child(even) td{background:var(--g50)}
.ntbl input,.ntbl select,.utbl input,.utbl select{width:100%;border:1px solid var(--g300);border-radius:5px;padding:6px 8px;font-size:12.5px;font-family:Arial,sans-serif;background:#fff;color:var(--g900)}
.ntbl input:focus,.ntbl select:focus,.utbl input:focus,.utbl select:focus{outline:none;border-color:var(--navy)}
.ext-inp{width:56px!important;text-align:center;font-weight:700;color:var(--navy)}
.del-btn{background:none;border:none;color:var(--g300);cursor:pointer;font-size:18px;padding:2px 6px;line-height:1;transition:color .15s}
.del-btn:hover{color:var(--red)}
.add-row-btn{display:inline-flex;align-items:center;gap:6px;background:var(--g100);border:1.5px dashed var(--g300);border-radius:7px;padding:8px 16px;font-size:13px;color:var(--g700);cursor:pointer;font-weight:500;font-family:Arial,sans-serif;transition:all .15s;margin-top:6px}
.add-row-btn:hover{background:var(--g200);border-color:var(--navy);color:var(--navy)}
.rtbl{width:100%;border-collapse:collapse;border-radius:8px;overflow:hidden;border:1px solid var(--g200);margin-bottom:16px}
.rtbl th{background:var(--navy);color:#fff;padding:10px 12px;text-align:left;font-size:12px;font-weight:600}
.rtbl td{padding:8px 8px;border-bottom:1px solid var(--g200);vertical-align:middle}
.rtbl tr:last-child td{border-bottom:none}
.rtbl tr:nth-child(even) td{background:var(--g50)}
.opt-lbl{font-weight:600;font-size:13px;color:var(--g700);white-space:nowrap;padding-right:12px;width:170px}
.rtbl input{width:100%;border:1px solid var(--g300);border-radius:5px;padding:7px 10px;font-size:13px;font-family:Arial,sans-serif;background:#fff}
.rtbl input:focus{outline:none;border-color:var(--navy)}
.ah-opts{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.ah-opt{display:flex;align-items:center;gap:12px;padding:13px 16px;border:2px solid var(--g200);border-radius:9px;cursor:pointer;transition:all .15s}
.ah-opt:hover{border-color:var(--navy)}
.ah-opt.selected{border-color:var(--navy);background:#EFF6FF}
.ah-opt input[type=radio]{accent-color:var(--navy)}
.ah-opt-text{font-size:14px;font-weight:500}
.cond{display:none}.cond.show{display:block}
.voice-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.voice-card{border:2px solid var(--g200);border-radius:9px;padding:10px 10px;cursor:pointer;transition:all .15s;text-align:center}
.voice-card:hover{border-color:var(--navy);background:var(--g50)}
.voice-card.selected{border-color:var(--navy);background:#EFF6FF}
.voice-icon{font-size:22px;margin-bottom:4px}
.voice-name{font-size:13px;font-weight:600;color:var(--g900)}
.voice-gender{font-size:11px;color:var(--g500);margin-bottom:6px}
.play-btn{display:inline-flex;align-items:center;gap:4px;background:var(--navy);color:#fff;border:none;border-radius:5px;padding:5px 10px;font-size:11.5px;cursor:pointer;font-family:Arial,sans-serif;font-weight:600;transition:background .15s}
.play-btn:hover{background:var(--navy2)}
.play-btn.playing{background:var(--green)}
.tog-wrap{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.tog{position:relative;width:44px;height:24px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0}
.tog-sl{position:absolute;inset:0;background:var(--g300);border-radius:24px;cursor:pointer;transition:background .2s}
.tog-sl::before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;left:3px;top:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog input:checked+.tog-sl{background:var(--navy)}
.tog input:checked+.tog-sl::before{transform:translateX(20px)}
.tog-lbl{font-size:14px;font-weight:500;color:var(--g700)}
.use-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.use-card{border:2px solid var(--g200);border-radius:9px;padding:13px 14px;cursor:pointer;transition:all .15s;display:flex;align-items:flex-start;gap:10px}
.use-card:hover{border-color:var(--navy)}
.use-card.selected{border-color:var(--navy);background:#EFF6FF}
.use-card input[type=checkbox]{margin-top:2px;accent-color:var(--navy);flex-shrink:0;width:15px;height:15px}
.use-card-title{font-size:13.5px;font-weight:600;color:var(--g900)}
.use-card-desc{font-size:12px;color:var(--g500);margin-top:2px}
.sample-area{width:100%;border:1px solid var(--g300);border-radius:7px;padding:8px 12px;font-size:13px;font-family:Arial,sans-serif;resize:vertical;margin-bottom:14px;line-height:1.5}
.sample-area:focus{outline:none;border-color:var(--navy)}
.divider{font-size:13px;font-weight:700;color:var(--navy);margin:22px 0 14px;display:flex;align-items:center;gap:10px}
.divider::after{content:'';flex:1;height:1px;background:var(--g200)}
.upload-zone{border:2px dashed var(--g300);border-radius:8px;padding:20px;text-align:center;cursor:pointer;transition:all .15s;position:relative;margin-bottom:8px}
.upload-zone:hover{border-color:var(--navy);background:#EFF6FF}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-zone-icon{font-size:28px;margin-bottom:6px}
.upload-zone-text{font-size:13.5px;font-weight:600;color:var(--g700)}
.upload-zone-hint{font-size:12px;color:var(--g500);margin-top:3px}
.upload-files{list-style:none;margin-top:8px;display:flex;flex-direction:column;gap:6px}
.upload-file{display:flex;align-items:center;gap:8px;background:var(--green-bg);border-radius:6px;padding:6px 10px;font-size:12.5px;color:#065f46}
.faq{border:1px solid var(--g200);border-radius:8px;margin-bottom:10px;overflow:hidden}
.faq-q{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--g900);background:#fff}
.faq-q:hover{background:var(--g50)}
.faq-icon{font-size:20px;color:var(--g500);font-weight:300;transition:transform .2s;line-height:1}
.faq-q.open .faq-icon{transform:rotate(45deg)}
.faq-a{display:none;padding:12px 16px;font-size:13.5px;color:var(--g700);line-height:1.6;border-top:1px solid var(--g200);background:var(--g50)}
.faq-a.show{display:block}
.rv-section{margin-bottom:20px}
.rv-title{font-size:11.5px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--g200)}
.rv-row{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;font-size:13.5px;border-bottom:1px solid var(--g100);gap:16px}
.rv-row:last-child{border-bottom:none}
.rv-key{color:var(--g500);flex-shrink:0;min-width:160px}
.rv-val{color:var(--g900);font-weight:500;text-align:right}
.rv-utbl{width:100%;border-collapse:collapse;font-size:12.5px;border-radius:6px;overflow:hidden;border:1px solid var(--g200)}
.rv-utbl th{background:var(--g100);padding:7px 10px;text-align:left;font-size:11px;color:var(--g500);text-transform:uppercase;letter-spacing:.4px}
.rv-utbl td{padding:7px 10px;border-bottom:1px solid var(--g100);color:var(--g700)}
.rv-utbl tr:last-child td{border-bottom:none}
.rv-script{font-size:12.5px;color:var(--g700);white-space:pre-wrap;background:var(--g50);padding:10px 12px;border-radius:6px;width:100%;margin-top:4px;line-height:1.6}
.nav-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--g200);padding:13px 16px;z-index:100}
.nav-inner{max-width:740px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 22px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:Arial,sans-serif}
.btn-sec{background:var(--g100);color:var(--g700)}.btn-sec:hover{background:var(--g200)}
.btn-pri{background:var(--navy);color:#fff}.btn-pri:hover{background:var(--navy2)}
.btn-sub{background:var(--green);color:#fff;font-size:15px;padding:11px 28px}.btn-sub:hover{background:var(--green2)}
.step-ct{font-size:13px;color:var(--g500)}
.succ{text-align:center;padding:36px 20px}
.succ-icon{width:72px;height:72px;background:var(--green-bg);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:34px;color:var(--green)}
.succ-h{font-size:24px;font-weight:700;color:var(--g900);margin-bottom:10px}
.succ-body{font-size:15px;color:var(--g500);line-height:1.7;max-width:440px;margin:0 auto 24px}
.succ-list{background:var(--green-bg);border-radius:10px;padding:16px 20px;max-width:380px;margin:0 auto 24px;text-align:left}
.succ-list h4{font-size:13.5px;font-weight:600;color:var(--green);margin-bottom:8px}
.succ-list ul{font-size:13px;color:var(--g700);line-height:2.1;padding-left:18px}
@media(max-width:640px){
  .field-row{grid-template-columns:1fr}
  .voice-grid{grid-template-columns:repeat(2,1fr)}
  .use-grid{grid-template-columns:1fr}
  .prog-label{display:none}
  .card{padding:18px}
}
</style>
</head>
<body>
<div class="hdr">
  <div>
    <div class="hdr-l">UNICOM Telecom</div>
    <div class="hdr-sub">Account Setup Wizard</div>
  </div>
  <div class="hdr-actions">
    <button class="hdr-btn" onclick="saveProgress()">💾 Save progress</button>
    <a class="hdr-btn" href="https://outlook.office.com/bookwithme/user/a5eed456acd44bc79b7486c7d3a21a3b%40unicomtelecom.com?anonymous&isanonymous=true" target="_blank">📅 Book a call</a>
  </div>
</div>
<div class="save-toast" id="saveToast">✅ Link copied! Share it to resume later.</div>
<div class="wrap">
  <div class="prog-wrap"><div class="prog-steps" id="prog"></div></div>
  <div id="content"></div>
</div>
<div class="nav-bar" id="navBar">
  <div class="nav-inner">
    <button class="btn btn-sec" id="btnBack" onclick="go(-1)">← Back</button>
    <span class="step-ct" id="stepCt"></span>
    <button class="btn btn-pri" id="btnNext" onclick="go(1)">Continue →</button>
  </div>
</div>
<script>
const VOICES = [{"name":"Ashley","gender":"Female","src":"audio/Ashley.wav"},{"name":"Ava","gender":"Female","src":"audio/Ava.mp3"},{"name":"Benjamin","gender":"Male","src":"audio/Benjamin.wav"},{"name":"Brandon","gender":"Male","src":"audio/Brandon.wav"},{"name":"Carmen","gender":"Female","src":"audio/Carmen.wav"},{"name":"David","gender":"Male","src":"audio/David.wav"},{"name":"Emily","gender":"Female","src":"audio/Emily.wav"},{"name":"Grace","gender":"Female","src":"audio/Grace.wav"},{"name":"Henry","gender":"Male","src":"audio/Henry.wav"},{"name":"Isobel","gender":"Female","src":"audio/Isobel.wav"},{"name":"James","gender":"Male","src":"audio/James.wav"},{"name":"Joe","gender":"Male","src":"audio/Joe.mp3"},{"name":"Judith","gender":"Female","src":"audio/Judith.wav"},{"name":"Leslie","gender":"Female","src":"audio/Leslie.wav"},{"name":"Oscar","gender":"Male","src":"audio/Oscar.wav"},{"name":"Wade","gender":"Male","src":"audio/Wade.mp3"}];

const STEPS = ['Phone Numbers','Users & Extensions','Greetings & Call Flow','SMS & Messaging','Review & Submit'];

const USE_CASES = [
  {id:'care',    label:'Customer Care',         desc:'Support, billing, account help',         sample:'Hi [Name], this is UNICOM Telecom following up on your recent request. Call us at [number] or reply here.'},
  {id:'appt',   label:'Appointment Reminders', desc:'Confirm and remind clients',              sample:'Hi [Name], reminder: your appointment is on [Date] at [Time]. Reply CONFIRM to confirm or STOP to opt out.'},
  {id:'updates',label:'Account Updates',       desc:'Notify customers of account changes',     sample:'Hi [Name], your account has been updated. Log in to review or call [number]. Reply STOP to opt out.'},
  {id:'notify', label:'Order / Status Alerts', desc:'Shipping, delivery, status updates',      sample:'Hi [Name], your order #[N] has shipped and arrives by [Date]. Track at [link]. Reply STOP to opt out.'},
  {id:'mktg',   label:'Promotions',            desc:'Deals, offers, marketing messages',       sample:'Hi [Name], we have a special offer for you: [offer]. Visit [link] or call [number]. Reply STOP to opt out.'},
  {id:'2fa',    label:'Verification Codes',    desc:'Two-factor auth or login codes',          sample:'Your UNICOM verification code is [CODE]. Expires in 10 min. Do not share with anyone.'},
];

const S = {
  step:0,
  numbers:[{num:'',type:'port-local',carrier:'',authName:''}],
  cnam:'',
  users:[
    {fn:'',ln:'',email:'',ext:'201',dev:'App',model:'',mac:''},
    {fn:'',ln:'',email:'',ext:'202',dev:'App',model:'',mac:''},
    {fn:'',ln:'',email:'',ext:'203',dev:'App',model:'',mac:''},
  ],
  mainScript:'Thank you for calling [Company Name].\n\nFor Sales, press 1.\nFor Support, press 2.\nFor our hours and location, press 9.\nTo speak with someone directly, press 0, or stay on the line.',
  afterScript:'Thank you for calling [Company Name]. Our office is currently closed.\n\nOur business hours are [your hours]. Please leave a message and we\'ll return your call on the next business day.',
  hoursScript:'Thank you for calling [Company Name].\n\nWe are open Monday through Friday, 9am to 5pm.\nWe are located at [your address].',
  voice:'Carmen',
  routing:[
    {opt:'Press 1',to:''},{opt:'Press 2',to:''},
    {opt:'Press 9',to:'Hours & location greeting'},{opt:'No Input / Timeout',to:''},
  ],
  ahOpt:'',ahFwd:'',ahOther:'',bizHours:'',bizAddr:'',
  smsOn:false,useCases:[],smsSamples:{},
  brandName:'',brandEIN:'',brandAddr:'',brandEmail:'',brandPhone:'',brandWebsite:'',
};

let currentAudio = null;

// SAVE & RESUME
function stateToHash(){ try{ return btoa(encodeURIComponent(JSON.stringify(S))); }catch(e){return '';} }
function hashToState(h){ try{ return JSON.parse(decodeURIComponent(atob(h))); }catch(e){return null;} }
function persistState(){ var h=stateToHash(); if(h) history.replaceState(null,'','#'+h); }
function loadFromHash(){
  var h=location.hash.slice(1); if(!h) return;
  var loaded=hashToState(h); if(!loaded) return;
  Object.assign(S,loaded);
}
function saveProgress(){
  persistState();
  navigator.clipboard.writeText(window.location.href).then(function(){
    var t=document.getElementById('saveToast');
    t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},3000);
  }).catch(function(){
    prompt('Copy this link to resume later:',window.location.href);
  });
}

// NAV
function go(dir){ save(); persistState(); var n=S.step+dir; if(n<0||n>STEPS.length) return; S.step=n; render(); window.scrollTo({top:0,behavior:'smooth'}); }

// SAVE
function g(id){ var e=document.getElementById(id); return e?e.value:''; }
function save(){
  var s=S.step;
  if(s===0){
    S.numbers=Array.from(document.querySelectorAll('.nrow')).map(function(r){
      return {num:r.querySelector('.nnum').value,type:r.querySelector('.ntype').value,
              carrier:r.querySelector('.ncarr').value,authName:r.querySelector('.nauth').value};
    });
    S.cnam=g('cnam');
  }
  if(s===1){
    S.users=Array.from(document.querySelectorAll('.urow')).map(function(r){
      return {fn:r.querySelector('.ufn').value,ln:r.querySelector('.uln').value,
              email:r.querySelector('.uem').value,ext:r.querySelector('.uex').value,
              dev:r.querySelector('.udv').value,
              model:r.querySelector('.umdl')?r.querySelector('.umdl').value:'',
              mac:r.querySelector('.umc').value};
    });
  }
  if(s===2){
    S.mainScript=g('mainScript')||S.mainScript;
    S.afterScript=g('afterScript')||S.afterScript;
    S.hoursScript=g('hoursScript')||S.hoursScript;
    var vc=document.querySelector('.voice-card.selected'); if(vc) S.voice=vc.dataset.v;

    S.ahFwd=g('ahFwd'); S.ahOther=g('ahOther'); S.bizHours=g('bizHours'); S.bizAddr=g('bizAddr');
  }
  if(s===3){
    var tog=document.getElementById('smsTog'); S.smsOn=tog?tog.checked:S.smsOn;
    S.useCases=Array.from(document.querySelectorAll('.use-card.selected')).map(function(c){return c.dataset.use;});
    S.smsSamples={};
    document.querySelectorAll('.sample-area').forEach(function(i){S.smsSamples[i.dataset.use]=i.value;});
    S.brandName=g('brandName');S.brandEIN=g('brandEIN');S.brandAddr=g('brandAddr');
    S.brandEmail=g('brandEmail');S.brandPhone=g('brandPhone');S.brandWebsite=g('brandWebsite');
  }
}

function render(){

  document.getElementById('navBar').style.display='';

  document.getElementById('btnBack').style.visibility=S.step===0?'hidden':'visible';
  var nb=document.getElementById('btnNext');
  if(S.step===STEPS.length-1){nb.textContent='Submit \u2713';nb.className='btn btn-sub';}
  else{nb.textContent='Continue \u2192';nb.className='btn btn-pri';}
  var fns=[step1,step2,step3,step4,step5];
  document.getElementById('content').innerHTML=fns[S.step]();
  bind();
}
function renderProg(){
  document.getElementById('prog').innerHTML=STEPS.map(function(s,i){

function playVoice(e,name){
  e.stopPropagation();
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  document.querySelectorAll('.play-btn').forEach(function(b){b.innerHTML='&#9654; Preview';b.classList.remove('playing');});
  var v=VOICES.find(function(x){return x.name===name;}); if(!v) return;
  var audio=new Audio(v.src); currentAudio=audio;
  var btn=document.getElementById('play_'+name);
  if(btn){btn.innerHTML='&#9646;&#9646; Stop';btn.classList.add('playing');}
  audio.play();
  audio.onended=function(){ if(btn){btn.innerHTML='&#9654; Preview';btn.classList.remove('playing');} currentAudio=null; };
}

// SUCCESS
function showSuccess(){
  submitData();
  document.getElementById('navBar').style.display='none';
  document.getElementById('content').innerHTML='<div class="card"><div class="succ">'
    +'<div class="succ-icon">\u2713</div>'
    +'<div class="succ-h">You\'re all set!</div>'
    +'<div class="succ-body">Thank you for completing your account setup.<br>Your UNICOM onboarding specialist will review everything and be in touch within <strong>1 business day</strong> to confirm your port date and installation schedule.</div>'

    +'</div></div>';
}

// ZAPIER
async function submitData(){
  var WEBHOOK='YOUR_ZAPIER_WEBHOOK_URL';
  if(WEBHOOK==='YOUR_ZAPIER_WEBHOOK_URL') return;
  try{ await fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({},S,{submittedAt:new Date().toISOString()}))}); }
  catch(e){ console.error('Webhook error:',e); }
}

// BIND
function bind(){
  document.querySelectorAll('.ah-opt').forEach(function(o){
    o.addEventListener('click',function(){
      document.querySelectorAll('.ah-opt').forEach(function(x){x.classList.remove('selected');});
      this.classList.add('selected');
      var v=this.querySelector('input').value;
      var ff=document.getElementById('ahFwdF'),of=document.getElementById('ahOtherF');
      if(ff) ff.className='cond'+(v==='forward'?' show':'');
      if(of) of.className='cond'+(v==='other'?' show':'');
    });
  });
}

// UTIL
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// INIT
loadFromHash();
render();
