<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNICOM Telecom — Account Setup</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f1f5f9;min-height:100vh}
.hdr{background:#002B6B;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.hdr-l{color:#fff;font-size:16px;font-weight:700}
.hdr-sub{color:#a8bdd9;font-size:12px;margin-top:2px}
.hdr-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);color:#fff;padding:7px 14px;border-radius:6px;text-decoration:none;font-size:13px;border:.5px solid rgba(255,255,255,.3)}
.prog{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 24px;display:flex;overflow-x:auto}
.prog-s{flex:1 0 auto;padding:12px 6px;background:none;border:none;border-bottom:3px solid transparent;cursor:default;text-align:center;min-width:90px}
.prog-s.active{border-bottom-color:#002B6B}
.prog-s.done{cursor:pointer}
.prog-dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 4px;font-size:11px;font-weight:700;transition:.2s}
.prog-lbl{font-size:10.5px;white-space:nowrap}
.content{max-width:760px;margin:0 auto;padding:24px 16px 100px}
.step-h{font-size:17px;font-weight:700;color:#002B6B;border-bottom:2px solid #e2e8f0;padding-bottom:10px;margin-bottom:16px}
.info{border-radius:0 6px 6px 0;padding:11px 15px;margin-bottom:14px;font-size:13.5px;line-height:1.6;border-left:4px solid}
.info.amber{background:#FEF3C7;border-color:#B45309;color:#92400E}
.info.blue{background:#DBEAFE;border-color:#1D4ED8;color:#1E40AF}
.info.green{background:#D1FAE5;border-color:#10B981;color:#065F46}
.rcard{border:1.5px solid #e2e8f0;background:#fff;border-radius:8px;padding:14px 16px;cursor:pointer;margin-bottom:10px;display:flex;align-items:flex-start;gap:12px;transition:.15s}
.rcard:hover{border-color:#93C5FD}
.rcard.sel{border:2px solid #002B6B;background:#EEF2FF}
.rdot{width:18px;height:18px;border-radius:50%;flex-shrink:0;margin-top:2px;border:2px solid #d1d5db;transition:.15s}
.rcard.sel .rdot{background:#002B6B;border-color:#002B6B}
.rl{font-weight:700;font-size:14px;color:#1f2937}
.rs{font-size:13px;color:#6b7280;margin-top:2px}
.rcard.sel .rl{color:#002B6B}
label.lbl{display:block;font-size:13px;font-weight:700;color:#374151;margin-bottom:5px}
.req{color:#dc2626}
input,select{width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;color:#1f2937;outline:none;transition:.15s}
input:focus,select:focus{border-color:#002B6B;box-shadow:0 0 0 2px rgba(0,43,107,.1)}
textarea{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;color:#1f2937;resize:vertical;outline:none;line-height:1.65;font-family:Arial,sans-serif}
textarea:focus{border-color:#002B6B}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:18px;margin-bottom:16px}
.tbl-wrap{border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;overflow-x:auto;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
thead tr{background:#002B6B}
th{color:#fff;padding:9px 10px;text-align:left;font-weight:700;font-size:12px;white-space:nowrap}
tbody tr:nth-child(even){background:#f9fafb}
tbody tr{border-bottom:1px solid #f3f4f6}
td{padding:6px 8px}
td input,td select{padding:4px 7px;font-size:12px;border:1px solid #d1d5db;border-radius:4px}
td input:disabled{opacity:.4;background:#f3f4f6}
.add-row{width:100%;padding:9px;background:none;border:1px dashed #d1d5db;border-radius:6px;cursor:pointer;font-size:13px;color:#6b7280;display:flex;align-items:center;justify-content:center;gap:6px}
.add-row:hover{border-color:#93C5FD;color:#002B6B}
.del-btn{background:none;border:none;cursor:pointer;color:#d1d5db;padding:2px 5px;font-size:16px;line-height:1}
.del-btn:hover{color:#EF4444}
.voice-card{border:1.5px solid #e2e8f0;background:#fff;border-radius:8px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;cursor:pointer;transition:.15s}
.voice-card:hover{border-color:#93C5FD}
.voice-card.sel{border:2px solid #002B6B;background:#EEF2FF}
.voice-name{font-weight:700;font-size:14px;color:#1f2937}
.voice-desc{font-size:12px;color:#6b7280;margin-top:2px}
.voice-card.sel .voice-name{color:#002B6B}
.play-btn{display:flex;align-items:center;gap:5px;padding:6px 14px;border:none;border-radius:5px;font-size:12px;font-weight:700;cursor:pointer;color:#fff;transition:.15s}
.play-btn.navy{background:#002B6B}
.play-btn.stop{background:#EF4444}
.chk-row{border:1px solid #e2e8f0;background:#fff;border-radius:8px;padding:14px 16px;margin-bottom:12px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:.15s}
.chk-row.done{border-color:#10B981;background:#ECFDF5}
.chk-detail{font-size:12.5px;color:#6b7280;margin-top:5px;white-space:pre-line;line-height:1.6}
.sms-opt{border:1.5px solid #e2e8f0;border-radius:8px;padding:16px;text-align:center;cursor:pointer;transition:.15s}
.sms-opt:hover{border-color:#93C5FD}
.sms-opt.sel{border:2px solid #002B6B;background:#EEF2FF}
.rev-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;margin-bottom:12px}
.rev-h{font-size:14px;font-weight:700;color:#002B6B;margin-bottom:10px;border-bottom:1px solid #f3f4f6;padding-bottom:8px}
.rev-row{display:flex;gap:16px;padding:5px 0;border-bottom:1px solid #f9fafb;font-size:13.5px}
.rev-l{color:#6b7280;min-width:160px;flex-shrink:0}
.rev-v{color:#1f2937;font-weight:600}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 -2px 8px rgba(0,0,0,.07)}
.btn-back{display:flex;align-items:center;gap:6px;font-size:14px;color:#6b7280;background:none;border:1px solid #d1d5db;border-radius:6px;padding:9px 18px;cursor:pointer}
.btn-next{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:#fff;background:#002B6B;border:none;border-radius:6px;padding:9px 22px;cursor:pointer}
.btn-next:disabled{background:#9ca3af;cursor:not-allowed}
.btn-submit{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:#fff;background:#10B981;border:none;border-radius:6px;padding:9px 22px;cursor:pointer}
.book-link{font-size:13px;color:#002B6B;text-decoration:none;display:flex;align-items:center;gap:5px}
.grid3{display:grid;grid-template-columns:1fr 1fr 72px;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.success{text-align:center;padding:60px 24px}
</style>
</head>

// ─── Audio helpers ────────────────────────────────────────────
let audioEl=null;
function playVoice(id){
  const v=VOICES.find(v=>v.id===id);
  if(!v)return;
  if(audioEl){audioEl.pause();audioEl=null;}
  audioEl=new Audio(v.src);
  audioEl.onended=()=>{playingVoice=null;render();};
  audioEl.onerror=()=>{playingVoice=null;render();};
  audioEl.play();
  playingVoice=id;
  render();
}
function stopVoice(){if(audioEl){audioEl.pause();audioEl=null;}playingVoice=null;render();}

// ─── Helpers ─────────────────────────────────────────────────
function upd(k,v){form[k]=v;render();}
function canNext(){
  if(step===0)return form.phoneType!=='';
  if(step===1)return form.users.some(u=>u.firstName.trim());
  if(step===2)return form.routingType!=='';
  if(step===4)return form.hasSMS!==null;
  return true;
}
function addUser(){const ext=String(200+form.users.length+1);form.users.push({firstName:'',lastName:'',email:'',ext,device:'App',model:'',mac:''});render();}
function removeUser(i){if(form.users.length>1){form.users.splice(i,1);render();}}
function updUser(i,k,v){form.users[i][k]=v;if(k==='device')render();}
function updMenu(i,v){form.menuOptions[i].ringsTo=v;}
function infoBox(txt,type){return`<div class="info ${type}">${txt}</div>`;}
function rCard(label,sub,val,icon,field){
  const sel=form[field]===val;
  return`<div class="rcard${sel?' sel':''}" onclick="upd('${field}','${val}')">
    <div class="rdot">${sel?'<div style="width:8px;height:8px;border-radius:50%;background:#fff;margin:auto"></div>':''}
    </div><div><div class="rl">${icon} ${label}</div>${sub?`<div class="rs">${sub}</div>`:''}</div></div>`;
}

  h+=rCard('Porting an existing local number','A standard 10-digit line from your current carrier','local','📞','phoneType');
  h+=rCard('Porting an existing toll-free number','An 800, 888, 877, 866, or 855 number','tollfree','📲','phoneType');
  h+=rCard('Getting a new number','We\'ll assign a number in your preferred area code','new','✨','phoneType');
  if(form.phoneType==='local')h+=infoBox(`<strong>Next:</strong> Complete a Letter of Authorization (LOA) to legally transfer your number.<br><br><a href="https://unicomtelecom.com/loa" target="_blank" style="color:#1D4ED8;font-weight:700">→ Complete your LOA</a>`,'blue');
  if(form.phoneType==='tollfree')h+=infoBox(`<strong>Next:</strong> Toll-free numbers are transferred via a RespOrg change.<br><br><a href="https://unicomtelecom.com/resporg" target="_blank" style="color:#1D4ED8;font-weight:700">→ Complete your RespOrg form</a>`,'blue');
  if(form.phoneType==='new')h+=`<div class="card"><div class="grid3">
    <div><label class="lbl">Preferred area code <span class="req">*</span></label><input value="${form.areaCode}" oninput="upd('areaCode',this.value)" placeholder="e.g. 973"></div>
    <div><label class="lbl">Backup area code</label><input value="${form.backupArea}" oninput="upd('backupArea',this.value)" placeholder="e.g. 862"></div>
    <div><label class="lbl">Qty</label><input type="number" min="1" value="${form.quantity}" oninput="upd('quantity',this.value)"></div>
  </div></div>`;
  return h;
}

function renderStep1(){
  let h=`<div class="step-h">Step 2 — Users & Extensions</div>`;
  h+=infoBox('Add each person who needs an extension. MAC address is only needed for physical desk phones.','amber');
  h+=`<div class="tbl-wrap"><table><thead><tr>
    <th>First Name</th><th>Last Name</th><th>Email</th><th>Ext.</th><th>Device</th><th>Device Model</th><th>MAC Address</th><th></th>
  </tr></thead><tbody>`;
  form.users.forEach((u,i)=>{
    const isPhone=u.device==='Desk Phone';
    const modelPh=isPhone?'e.g. Yealink T46S':'e.g. iPhone / Android';
    h+=`<tr>
      <td><input value="${u.firstName}" oninput="updUser(${i},'firstName',this.value)" placeholder="First" style="min-width:80px"></td>
      <td><input value="${u.lastName}" oninput="updUser(${i},'lastName',this.value)" placeholder="Last" style="min-width:80px"></td>
      <td><input value="${u.email}" oninput="updUser(${i},'email',this.value)" placeholder="email@company.com" style="min-width:130px"></td>
      <td><input value="${u.ext}" oninput="updUser(${i},'ext',this.value)" style="width:52px"></td>
      <td><select onchange="updUser(${i},'device',this.value)" style="min-width:95px"><option${u.device==='App'?' selected':''}>App</option><option${u.device==='Desk Phone'?' selected':''}>Desk Phone</option></select></td>
      <td><input value="${u.model}" oninput="updUser(${i},'model',this.value)" placeholder="${modelPh}" style="min-width:130px"></td>
      <td><input value="${u.mac}" oninput="updUser(${i},'mac',this.value)" placeholder="${isPhone?'XX:XX:XX:XX:XX:XX':'—'}" ${!isPhone?'disabled':''} style="min-width:130px"></td>
      <td><button class="del-btn" onclick="removeUser(${i})">✕</button></td>
    </tr>`;
  });
  h+=`</tbody></table></div>`;
  h+=`<button class="add-row" onclick="addUser()">+ Add Another User</button>`;
  return h;
}

function renderStep2(){
  let h=`<div class="step-h">Step 3 — Call Flow</div>`;
  h+=infoBox('When someone calls your number, how should it be handled?','amber');
  h+=rCard('Ring directly to an extension or group','Calls go straight to a person or group — no menu','direct','📱','routingType');
  h+=rCard('Play a welcome menu (Auto Attendant / IVR)','Callers hear a greeting and press a number to be routed','menu','☎️','routingType');
  h+=rCard('Time-based routing','Different behavior during business hours vs. after hours','timebased','🕐','routingType');
  if(form.routingType==='direct')h+=`<div class="card"><label class="lbl">Which extension or group should calls ring to? <span class="req">*</span></label>
    <input value="${form.directExt}" oninput="upd('directExt',this.value)" placeholder="e.g. Ext. 201, or Sales Group (201, 202, 203)"></div>`;
  if(form.routingType==='timebased')h+=`<div class="card"><label class="lbl">Business hours <span class="req">*</span></label>
    <input value="${form.businessHours}" oninput="upd('businessHours',this.value)" placeholder="e.g. Mon–Fri 9am–5pm EST; Sat–Sun Closed"></div>`;
  if(form.routingType==='menu'||form.routingType==='timebased'){
    h+=infoBox('<strong>Ring groups:</strong> Simultaneous rings all extensions at once. Cascade/Linear rings one at a time. Note your preference in the "Rings To" column.','blue');
    h+=`<div style="font-size:13px;font-weight:700;color:#374151;margin-bottom:8px">Menu options — where should each option ring?</div>
    <div class="tbl-wrap"><table><thead><tr><th style="width:35%">Option</th><th>Rings To</th></tr></thead><tbody>`;
    form.menuOptions.forEach((o,i)=>{h+=`<tr><td style="font-weight:700">${o.option}</td><td>
      <input value="${o.ringsTo}" oninput="updMenu(${i},this.value)" placeholder="e.g. Ext. 201, Sales Group, Voicemail">
    </td></tr>`;});
    h+=`</tbody></table></div>`;
  }
  if(form.routingType==='timebased'){
    h+=`<div class="card"><div style="font-size:14px;font-weight:700;margin-bottom:10px">After-Hours Routing</div>`;
    [{v:'voicemail',l:'Go to voicemail'},{v:'forward',l:'Ring to a cell / forwarding number'},{v:'other',l:'Other'}].forEach(o=>{
      h+=`<label style="display:flex;align-items:center;gap:8px;margin-bottom:8px;cursor:pointer;font-size:14px">
        <input type="radio" name="aft" ${form.afterHoursType===o.v?'checked':''} onchange="upd('afterHoursType','${o.v}')"> ${o.l}</label>`;
    });
    if(form.afterHoursType==='forward')h+=`<div style="margin-top:8px"><label class="lbl">Forwarding number</label>
      <input value="${form.forwardNumber}" oninput="upd('forwardNumber',this.value)" placeholder="e.g. 973-555-0100"></div>`;
    h+=`</div>`;
  }
  return h;
}

function renderStep3(){
  let h=`<div class="step-h">Step 4 — Auto Attendant Greetings</div>`;
  h+=infoBox('Edit the sample scripts below. Replace anything in [brackets] with your info. These will be recorded in your selected voice.','amber');
  h+=`<div class="card"><div style="font-size:14px;font-weight:700;margin-bottom:12px">🎙️ Select a Voice</div>`;
  VOICES.forEach(v=>{
    const isSel=form.selectedVoice===v.id;
    const isPlaying=playingVoice===v.id;
    h+=`<div class="voice-card${isSel?' sel':''}" onclick="upd('selectedVoice','${v.id}')">
      <div><div class="voice-name">${v.name}</div><div class="voice-desc">${v.desc}</div></div>
      <button class="play-btn ${isPlaying?'stop':'navy'}" onclick="event.stopPropagation();${isPlaying?'stopVoice()':'playVoice(\''+v.id+'\')'}">${isPlaying?'■ Stop':'▶ Preview'}</button>
    </div>`;
  });
  if(VOICES.length<3)h+=`<div style="font-size:13px;color:#6b7280;font-style:italic;margin-top:8px">Additional voice options coming soon — share the audio files from unicomtelecom.com/audio to add them here.</div>
    <div style="margin-top:12px"><label class="lbl">Preferred voice style (if not shown above)</label>
    <input value="${form.voicePref}" oninput="upd('voicePref',this.value)" placeholder="e.g. Professional male, confident and clear"></div>`;
  h+=`</div>`;
  h+=`<div style="margin-bottom:16px"><div style="font-size:14px;font-weight:700;margin-bottom:3px">4A — Main Greeting & Call Routing</div>
    <div style="font-size:12px;color:#6b7280;margin-bottom:8px">Edit as needed. Replace [brackets] with your info.</div>
    <textarea rows="6" oninput="upd('mainScript',this.value)">${form.mainScript}</textarea></div>`;
  if(form.routingType==='timebased'){
    h+=`<div style="margin-bottom:16px"><div style="font-size:14px;font-weight:700;margin-bottom:3px">4B — After-Hours Greeting</div>
      <div style="font-size:12px;color:#6b7280;margin-bottom:8px">Played when someone calls outside your business hours.</div>
      <textarea rows="5" oninput="upd('afterScript',this.value)">${form.afterScript}</textarea></div>`;
    h+=`<div style="margin-bottom:16px"><div style="font-size:14px;font-weight:700;margin-bottom:3px">4C — Hours & Location Greeting</div>
      <div style="font-size:12px;color:#6b7280;margin-bottom:8px">Played when a caller presses the hours option (typically Press 9).</div>
      <textarea rows="5" oninput="upd('hoursScript',this.value)">${form.hoursScript}</textarea></div>`;
  }
  return h;
}

function renderStep4(){
  let h=`<div class="step-h">Step 5 — SMS / Business Texting</div>`;
  h+=infoBox('Only applies if texting was included in your Unicom plan.','amber');
  h+=`<div class="grid2" style="margin-bottom:20px">`;
  [{v:true,icon:'💬',l:'Yes, I have texting'},{v:false,icon:'⏭️',l:'No, skip this step'}].forEach(o=>{
    const isSel=form.hasSMS===o.v;
    h+=`<div class="sms-opt${isSel?' sel':''}" onclick="upd('hasSMS',${o.v})">
      <div style="font-size:22px;margin-bottom:6px">${o.icon}</div>
      <div style="font-size:14px;font-weight:700;color:${isSel?NAVY:'#1f2937'}">${o.l}</div></div>`;
  });
  h+=`</div>`;
  if(form.hasSMS===true){
    h+=infoBox('We submit a <strong>10DLC Campaign Registration</strong> on your behalf — an industry-wide carrier requirement. Your website needs two updates before we can submit.','blue');
    [{key:'smsForm',title:'SMS opt-in checkbox added to all contact forms',detail:`Any form collecting a phone number needs:\n• Phone number field set to NOT required\n• An opt-in checkbox (not pre-checked) with this text:\n\n"I consent to receive text messages about [services] from [Company] at the phone number I provided. Consent is not a condition of purchase. Msg & data rates may apply. Reply STOP to opt out."`},
     {key:'smsPrivacy',title:'Privacy policy updated with SMS disclosure',detail:`Your privacy policy must include:\n\n"No mobile information will be shared with third parties/affiliates for marketing/promotional purposes. All other categories exclude text messaging originator opt-in data and consent; this information will not be shared with any third parties."`}
    ].forEach(item=>{
      const done=form[item.key];
      h+=`<div class="chk-row${done?' done':''}" onclick="upd('${item.key}',${!done})">
        <input type="checkbox" ${done?'checked':''} style="width:15px;height:15px;flex-shrink:0;margin-top:2px">
        <div><div style="font-weight:700;font-size:14px;color:${done?'#065F46':'#1f2937'}">${done?'✅ ':''}${item.title}</div>
        <div class="chk-detail">${item.detail}</div></div></div>`;
    });
    h+=infoBox('Have a web developer? Reply to your onboarding email with them CC\'d — we\'ll work directly with them.','amber');
  }
  if(form.hasSMS===false)h+=infoBox('No SMS action needed. Click Continue to review your setup.','green');
  return h;
}

function renderStep5(){
  const typeLabel={local:'Porting local number (LOA)',tollfree:'Porting toll-free (RespOrg)',new:'New number'}[form.phoneType]||'—';
  const routeLabel={direct:'Direct to extension',menu:'Welcome menu (IVR)',timebased:'Time-based routing'}[form.routingType]||'—';
  const rv=(l,v)=>v?`<div class="rev-row"><div class="rev-l">${l}</div><div class="rev-v">${v}</div></div>`:'';
  let h=`<div class="step-h">Step 6 — Review & Submit</div>`;
  h+=infoBox('Review your details below. Once submitted, our onboarding team will begin setup and reach out within 1 business day.','blue');
  h+=`<div class="rev-card"><div class="rev-h">📞 Phone Numbers</div>${rv('Type',typeLabel)}${form.phoneType==='new'?rv('Preferred area code',form.areaCode)+rv('Backup area code',form.backupArea)+rv('Quantity',form.quantity):''}</div>`;
  const activeUsers=form.users.filter(u=>u.firstName.trim());
  h+=`<div class="rev-card"><div class="rev-h">👥 Users & Extensions</div>${activeUsers.map(u=>rv(`Ext. ${u.ext} — ${u.firstName} ${u.lastName}`,`${u.device}${u.model?' ('+u.model+')':''}${u.email?' · '+u.email:''}`)).join('')}</div>`;
  h+=`<div class="rev-card"><div class="rev-h">☎️ Call Flow</div>${rv('Routing',routeLabel)}${form.routingType==='direct'?rv('Rings to',form.directExt):''}${form.routingType==='timebased'?rv('Business hours',form.businessHours):''}${(form.routingType==='menu'||form.routingType==='timebased')?form.menuOptions.filter(o=>o.ringsTo).map(o=>rv(o.option,o.ringsTo)).join(''):''}</div>`;
  const selVoice=VOICES.find(v=>v.id===form.selectedVoice);
  h+=`<div class="rev-card"><div class="rev-h">🎙️ Auto Attendant</div>${rv('Selected voice',selVoice?selVoice.name:form.voicePref||'Not selected')}
    <div style="font-size:13px;color:#6b7280;margin-top:8px">Main greeting:</div>
    <div style="background:#f9fafb;border:1px solid #e2e8f0;border-radius:6px;padding:10px;font-size:13px;white-space:pre-line;line-height:1.6;margin-top:4px">${form.mainScript}</div></div>`;
  if(form.hasSMS!==null)h+=`<div class="rev-card"><div class="rev-h">💬 SMS / Texting</div>${rv('SMS included',form.hasSMS?'Yes':'No')}${form.hasSMS?rv('Opt-in form added',form.smsForm?'✅ Confirmed':'⏳ Pending')+rv('Privacy policy updated',form.smsPrivacy?'✅ Confirmed':'⏳ Pending'):''}</div>`;
  return h;
}

function renderSuccess(){
  const name=form.users.find(u=>u.firstName.trim())?.firstName||'';
  return`<div class="success">
    <div style="font-size:60px;margin-bottom:16px">🎉</div>
    <h2 style="font-size:26px;color:#002B6B;font-weight:700;margin-bottom:10px">You're all set${name?', '+name:''}!</h2>
    <p style="color:#6b7280;font-size:15px;line-height:1.7;max-width:480px;margin:0 auto 24px">Thank you! Your setup details have been submitted. Our onboarding team will review everything and be in touch within 1 business day.</p>
    <div style="background:#D1FAE5;border:1px solid #6EE7B7;border-radius:10px;padding:20px 24px;max-width:400px;margin:0 auto 24px;text-align:left">
      <div style="font-weight:700;color:#065F46;margin-bottom:8px">What happens next</div>
      <ul style="font-size:14px;color:#374151;line-height:2.2;padding-left:18px">
        <li>Our team reviews your submitted details</li>
        <li>Extensions, call flow, and greetings are built</li>
        <li>We confirm everything before going live</li>
        <li>Your system activates on your agreed start date</li>
      </ul>
    </div>
    <a href="https://outlook.office.com/bookwithme/user/a5eed456acd44bc79b7486c7d3a21a3b%40unicomtelecom.com?anonymous&isanonymous=true" target="_blank"
      style="display:inline-flex;align-items:center;gap:8px;background:#002B6B;color:#fff;padding:12px 28px;border-radius:6px;text-decoration:none;font-weight:700;font-size:15px">📅 Schedule a follow-up call</a>
  </div>`;
}

// ─── Render ───────────────────────────────────────────────────
function renderProg(){
  document.getElementById('prog').innerHTML=STEPS.map((s,i)=>{
    const done=i<step,active=i===step;
    const bg=done?'#10B981':active?NAVY:'#e2e8f0';
    const col=i<=step?'#fff':'#6b7280';
    const lbl=active?NAVY:'#6b7280';
    return`<button class="prog-s${done?' done':''}${active?' active':''}" onclick="${done?`goStep(${i})`:'void 0'}">
      <div class="prog-dot" style="background:${bg};color:${col}">${done?'✓':i+1}</div>
      <div class="prog-lbl" style="color:${lbl};font-weight:${active?'700':'400'}">${s}</div>
    </button>`;
  }).join('');
}
window.goStep=i=>{if(i<step){step=i;render();}};

function render(){
  if(submitted){
    document.getElementById('prog').style.display='none';
    document.getElementById('content').innerHTML=renderSuccess();
    document.getElementById('nav').innerHTML='';
    return;
  }
  renderProg();
  const fns=[renderStep0,renderStep1,renderStep2,renderStep3,renderStep4,renderStep5];
  document.getElementById('content').innerHTML=fns[step]();
  const ok=canNext();
  document.getElementById('nav').innerHTML=`
    <div>${step>0?`<button class="btn-back" onclick="goStep(${step-1})">← Back</button>`:''}</div>
    <div style="display:flex;align-items:center;gap:16px">
      <a class="book-link" href="https://outlook.office.com/bookwithme/user/a5eed456acd44bc79b7486c7d3a21a3b%40unicomtelecom.com?anonymous&isanonymous=true" target="_blank">📅 Need help?</a>
      ${step<5?`<button class="btn-next" ${ok?'':'disabled'} onclick="${ok?'step++;render()':'void 0'}">Continue →</button>`
               :`<button class="btn-submit" onclick="submitted=true;render()">Submit Setup ✓</button>`}
    </div>`;
}

// globals for inline handlers
window.upd=upd; window.addUser=addUser; window.removeUser=removeUser;
window.updUser=updUser; window.updMenu=updMenu;
window.playVoice=playVoice; window.stopVoice=stopVoice;

render();
</script>
</body>
